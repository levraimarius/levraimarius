<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bulle Pop 🫧</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    touch-action: none;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    background: #ffeef5;
  }
  canvas { display: block; width: 100%; height: 100%; cursor: pointer; }
  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 16px 20px;
    pointer-events: none;
  }
  .badge {
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(6px);
    border-radius: 20px;
    padding: 10px 18px;
    box-shadow: 0 4px 14px rgba(180, 120, 160, 0.18);
    text-align: center;
  }
  .badge .label {
    font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
    color: #c98bb0; font-weight: 600;
  }
  .badge .value {
    font-size: 26px; font-weight: 800; color: #8a5a7a;
    font-variant-numeric: tabular-nums;
  }
  #combo {
    position: fixed; top: 90px; left: 50%; transform: translateX(-50%) scale(0);
    font-size: 30px; font-weight: 800; color: #ff8fab;
    text-shadow: 0 2px 0 #fff, 0 4px 12px rgba(255, 143, 171, 0.4);
    transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
  }
  #combo.show { transform: translateX(-50%) scale(1); }
  #hint {
    position: fixed; bottom: 24px; left: 0; right: 0;
    text-align: center; color: #c98bb0; font-size: 15px; font-weight: 600;
    pointer-events: none;
    animation: floaty 2.4s ease-in-out infinite;
    transition: opacity 1s;
  }
  @keyframes floaty {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="badge"><div class="label">Score</div><div class="value" id="score">0</div></div>
  <div class="badge"><div class="label">Record</div><div class="value" id="best">0</div></div>
</div>
<div id="combo"></div>
<div id="hint">🫧 Clique sur les bulles pour les faire éclater !</div>
<script>
(() => {
  'use strict';

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const comboEl = document.getElementById('combo');
  const hintEl = document.getElementById('hint');

  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- État ----------
  let score = 0;
  let best = +(localStorage.getItem('bullepop-best') || 0);
  let combo = 0;
  let lastPopTime = 0;
  let displayedScore = 0;
  let firstPop = false;
  bestEl.textContent = best;

  const PASTELS = [
    { body: '#ffb3c6', cheek: '#ff8fab' }, // rose
    { body: '#a8d8ea', cheek: '#7ec4dd' }, // bleu ciel
    { body: '#c3aed6', cheek: '#a98bc4' }, // lilas
    { body: '#b5ead7', cheek: '#8fd6ba' }, // menthe
    { body: '#ffdac1', cheek: '#ffc29e' }, // pêche
    { body: '#fff5ba', cheek: '#f5e58a' }, // citron doux
  ];
  const GOLD = { body: '#ffd96a', cheek: '#ffb830' };

  const bubbles = [];
  const particles = [];
  const popups = [];
  const clouds = [];

  for (let i = 0; i < 6; i++) {
    clouds.push({
      x: Math.random() * W,
      y: Math.random() * H * 0.7,
      r: 40 + Math.random() * 60,
      speed: 0.08 + Math.random() * 0.12,
    });
  }

  // ---------- Audio (sons doux générés, aucun fichier) ----------
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function playPop(pitch, golden) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(pitch, t);
    osc.frequency.exponentialRampToValueAtTime(pitch * 1.8, t + 0.08);
    gain.gain.setValueAtTime(0.001, t);
    gain.gain.exponentialRampToValueAtTime(golden ? 0.22 : 0.16, t + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + 0.25);
    if (golden) {
      // petit carillon en plus pour la bulle dorée
      [880, 1174, 1568].forEach((f, i) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'triangle';
        o.frequency.value = f;
        g.gain.setValueAtTime(0.001, t + i * 0.07);
        g.gain.exponentialRampToValueAtTime(0.1, t + i * 0.07 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.07 + 0.3);
        o.connect(g).connect(audioCtx.destination);
        o.start(t + i * 0.07);
        o.stop(t + i * 0.07 + 0.35);
      });
    }
  }

  // ---------- Bulles ----------
  function spawnBubble() {
    const golden = Math.random() < 0.06;
    const r = golden ? 26 + Math.random() * 8 : 24 + Math.random() * 26;
    const palette = golden ? GOLD : PASTELS[(Math.random() * PASTELS.length) | 0];
    bubbles.push({
      x: r + Math.random() * (W - r * 2),
      y: H + r + 10,
      r,
      baseR: r,
      vy: -(0.35 + Math.random() * 0.45) * (golden ? 1.6 : 1),
      wobblePhase: Math.random() * Math.PI * 2,
      wobbleSpeed: 0.015 + Math.random() * 0.02,
      wobbleAmp: 0.5 + Math.random() * 0.8,
      palette,
      golden,
      blink: 0,
      nextBlink: 120 + Math.random() * 240,
      squish: 0,
      birth: performance.now(),
    });
  }

  function spawnParticles(x, y, color, golden) {
    const n = golden ? 26 : 14;
    for (let i = 0; i < n; i++) {
      const a = (Math.PI * 2 * i) / n + Math.random() * 0.5;
      const sp = 1.5 + Math.random() * 3.5;
      particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 1,
        r: 2 + Math.random() * 4,
        life: 1,
        decay: 0.015 + Math.random() * 0.02,
        color: golden ? (Math.random() < 0.5 ? '#ffd96a' : '#fff3c4') : color,
        star: golden || Math.random() < 0.25,
        rot: Math.random() * Math.PI * 2,
        vrot: (Math.random() - 0.5) * 0.2,
      });
    }
  }

  function addPopup(x, y, text, golden) {
    popups.push({ x, y, text, life: 1, golden });
  }

  // ---------- Interaction ----------
  function popAt(px, py) {
    ensureAudio();
    // on prend la bulle la plus proche du clic (avec une marge généreuse, zéro frustration)
    let hit = -1, hitDist = Infinity;
    for (let i = 0; i < bubbles.length; i++) {
      const b = bubbles[i];
      const d = Math.hypot(b.x - px, b.y - py);
      if (d < b.r + 14 && d < hitDist) { hit = i; hitDist = d; }
    }
    if (hit === -1) return;

    const b = bubbles.splice(hit, 1)[0];
    const now = performance.now();
    combo = (now - lastPopTime < 1600) ? Math.min(combo + 1, 10) : 1;
    lastPopTime = now;

    const mult = Math.min(1 + Math.floor((combo - 1) / 2), 5); // x1 à x5
    const base = b.golden ? 50 : Math.max(1, Math.round((50 - b.baseR) / 7) + 1);
    const points = base * mult;
    score += points;

    spawnParticles(b.x, b.y, b.palette.body, b.golden);
    addPopup(b.x, b.y - b.r, '+' + points, b.golden);
    playPop(300 + (50 - b.baseR) * 12 + Math.random() * 60, b.golden);

    if (combo >= 3) {
      comboEl.textContent = 'Combo x' + mult + ' ✨';
      comboEl.classList.add('show');
      clearTimeout(comboEl._t);
      comboEl._t = setTimeout(() => comboEl.classList.remove('show'), 900);
    }

    if (score > best) {
      best = score;
      localStorage.setItem('bullepop-best', best);
      bestEl.textContent = best;
    }
    if (!firstPop) { firstPop = true; hintEl.style.opacity = '0'; }
  }

  canvas.addEventListener('pointerdown', (e) => popAt(e.clientX, e.clientY));

  // ---------- Dessin ----------
  function drawBackground(time) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#ffeef5');
    g.addColorStop(0.55, '#fde2ef');
    g.addColorStop(1, '#e3f0ff');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
    for (const cl of clouds) {
      cl.x += cl.speed;
      if (cl.x - cl.r * 2 > W) cl.x = -cl.r * 2;
      ctx.beginPath();
      ctx.arc(cl.x, cl.y, cl.r * 0.6, 0, Math.PI * 2);
      ctx.arc(cl.x + cl.r * 0.5, cl.y - cl.r * 0.25, cl.r * 0.45, 0, Math.PI * 2);
      ctx.arc(cl.x + cl.r, cl.y, cl.r * 0.55, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawBubble(b, time) {
    const age = (time - b.birth) / 1000;
    const popIn = Math.min(1, age * 4);
    const ease = 1 - Math.pow(1 - popIn, 3);
    const wob = Math.sin(time * 0.003 + b.wobblePhase) * 0.06;
    const rx = b.r * ease * (1 + wob);
    const ry = b.r * ease * (1 - wob);

    ctx.save();
    ctx.translate(b.x, b.y);

    if (b.golden) {
      ctx.shadowColor = 'rgba(255, 200, 60, 0.8)';
      ctx.shadowBlur = 24;
    }

    // corps
    ctx.beginPath();
    ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
    ctx.fillStyle = b.palette.body;
    ctx.fill();
    ctx.shadowBlur = 0;

    // reflet de bulle
    ctx.beginPath();
    ctx.ellipse(-rx * 0.35, -ry * 0.4, rx * 0.22, ry * 0.14, -0.6, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
    ctx.fill();

    // visage kawaii
    const eyeY = -ry * 0.05;
    const eyeX = rx * 0.32;
    ctx.fillStyle = '#5a4a52';
    b.nextBlink--;
    if (b.nextBlink <= 0) { b.blink = 8; b.nextBlink = 150 + Math.random() * 250; }
    if (b.blink > 0) b.blink--;
    if (b.blink > 0) {
      ctx.lineWidth = Math.max(1.5, rx * 0.06);
      ctx.strokeStyle = '#5a4a52';
      ctx.lineCap = 'round';
      [-1, 1].forEach(s => {
        ctx.beginPath();
        ctx.moveTo(s * eyeX - rx * 0.1, eyeY);
        ctx.lineTo(s * eyeX + rx * 0.1, eyeY);
        ctx.stroke();
      });
    } else {
      [-1, 1].forEach(s => {
        ctx.beginPath();
        ctx.arc(s * eyeX, eyeY, Math.max(2, rx * 0.09), 0, Math.PI * 2);
        ctx.fill();
      });
    }

    // sourire
    ctx.beginPath();
    ctx.arc(0, ry * 0.18, rx * 0.16, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.lineWidth = Math.max(1.5, rx * 0.05);
    ctx.strokeStyle = '#5a4a52';
    ctx.lineCap = 'round';
    ctx.stroke();

    // joues roses
    ctx.fillStyle = b.palette.cheek;
    ctx.globalAlpha = 0.55;
    [-1, 1].forEach(s => {
      ctx.beginPath();
      ctx.ellipse(s * rx * 0.55, ry * 0.18, rx * 0.13, ry * 0.09, 0, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;

    // petite couronne sur la bulle dorée
    if (b.golden) {
      ctx.fillStyle = '#ffb830';
      ctx.beginPath();
      const cw = rx * 0.5, ch = ry * 0.32, cy = -ry - ch * 0.2;
      ctx.moveTo(-cw, cy);
      ctx.lineTo(-cw, cy - ch);
      ctx.lineTo(-cw * 0.5, cy - ch * 0.45);
      ctx.lineTo(0, cy - ch * 1.15);
      ctx.lineTo(cw * 0.5, cy - ch * 0.45);
      ctx.lineTo(cw, cy - ch);
      ctx.lineTo(cw, cy);
      ctx.closePath();
      ctx.fill();
    }

    ctx.restore();
  }

  function drawStar(x, y, r, rot, color, alpha) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = (i * 4 * Math.PI) / 5 - Math.PI / 2;
      ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // ---------- Boucle ----------
  let spawnTimer = 0;
  let lastTime = performance.now();

  function frame(time) {
    const dt = Math.min((time - lastTime) / 16.67, 3);
    lastTime = time;

    drawBackground(time);

    // apparition des bulles : densité confortable, jamais vide
    spawnTimer -= dt;
    const target = Math.min(14, 6 + Math.floor(score / 200));
    if (spawnTimer <= 0 && bubbles.length < target) {
      spawnBubble();
      spawnTimer = 25 + Math.random() * 35;
    }

    // bulles
    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      b.wobblePhase += b.wobbleSpeed * dt;
      b.x += Math.sin(b.wobblePhase) * b.wobbleAmp * dt;
      b.y += b.vy * dt;
      if (b.x < b.r) b.x = b.r;
      if (b.x > W - b.r) b.x = W - b.r;
      if (b.y < -b.r * 2) { bubbles.splice(i, 1); continue; } // elle s'envole, c'est tout
      drawBubble(b, time);
    }

    // particules
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 0.06 * dt;
      p.rot += p.vrot * dt;
      p.life -= p.decay * dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      if (p.star) {
        drawStar(p.x, p.y, p.r * p.life * 1.6, p.rot, p.color, p.life);
      } else {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    // popups "+N"
    for (let i = popups.length - 1; i >= 0; i--) {
      const p = popups[i];
      p.y -= 0.8 * dt;
      p.life -= 0.02 * dt;
      if (p.life <= 0) { popups.splice(i, 1); continue; }
      ctx.globalAlpha = Math.min(1, p.life * 2);
      ctx.font = '800 ' + (p.golden ? 30 : 22) + 'px "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = p.golden ? '#ff9f1c' : '#ff8fab';
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.lineWidth = 4;
      ctx.strokeText(p.text, p.x, p.y);
      ctx.fillText(p.text, p.x, p.y);
      ctx.globalAlpha = 1;
    }

    // score animé en douceur
    if (displayedScore !== score) {
      displayedScore += Math.ceil((score - displayedScore) * 0.2);
      if (Math.abs(score - displayedScore) < 1) displayedScore = score;
      scoreEl.textContent = displayedScore;
    }

    requestAnimationFrame(frame);
  }

  // quelques bulles dès le départ, réparties à l'écran
  for (let i = 0; i < 7; i++) {
    spawnBubble();
    const b = bubbles[bubbles.length - 1];
    b.y = H * 0.15 + Math.random() * H * 0.7;
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
