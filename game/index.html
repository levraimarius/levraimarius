<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffeef5">
<title>Bulle Pop 🫧</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    background: #ffeef5;
  }
  canvas { display: block; width: 100%; height: 100%; cursor: pointer; }
  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: calc(12px + env(safe-area-inset-top, 0px))
             calc(16px + env(safe-area-inset-right, 0px))
             0
             calc(16px + env(safe-area-inset-left, 0px));
    pointer-events: none;
  }
  .badge {
    background: rgba(255, 255, 255, 0.78);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-radius: 18px;
    padding: 8px 16px;
    box-shadow: 0 4px 14px rgba(120, 90, 140, 0.2);
    text-align: center;
    min-width: 92px;
  }
  .badge .label {
    font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
    color: #c98bb0; font-weight: 700;
  }
  .badge .value {
    font-size: 24px; font-weight: 800; color: #8a5a7a;
    font-variant-numeric: tabular-nums;
    line-height: 1.15;
  }
  .badge .sub {
    font-size: 11px; color: #c98bb0; font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  #combo {
    position: fixed; top: calc(86px + env(safe-area-inset-top, 0px));
    left: 50%; transform: translateX(-50%) scale(0);
    font-size: 28px; font-weight: 800; color: #ff8fab;
    text-shadow: 0 2px 0 #fff, 0 4px 12px rgba(255, 143, 171, 0.45);
    transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
    white-space: nowrap;
  }
  #combo.show { transform: translateX(-50%) scale(1); }
  #toast {
    position: fixed; top: 34%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: 28px; font-weight: 800; color: #fff;
    background: linear-gradient(135deg, #ff8fab, #c98be0);
    padding: 14px 28px; border-radius: 999px;
    box-shadow: 0 8px 30px rgba(200, 100, 180, 0.45);
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
    white-space: nowrap;
    max-width: 94vw;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: center;
  }
  #toast.show { transform: translate(-50%, -50%) scale(1); }
  #hint {
    position: fixed; bottom: calc(76px + env(safe-area-inset-bottom, 0px));
    left: 0; right: 0;
    text-align: center; color: #c98bb0; font-size: 15px; font-weight: 700;
    text-shadow: 0 1px 0 #fff;
    pointer-events: none;
    animation: floaty 2.4s ease-in-out infinite;
    transition: opacity 1s;
    padding: 0 16px;
  }
  @keyframes floaty {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .roundBtn {
    position: fixed;
    width: 48px; height: 48px;
    border: none; border-radius: 50%;
    background: rgba(255, 255, 255, 0.78);
    box-shadow: 0 4px 14px rgba(120, 90, 140, 0.2);
    font-size: 22px;
    cursor: pointer;
    touch-action: manipulation;
    transition: opacity 0.2s, transform 0.1s;
  }
  .roundBtn:active { transform: scale(0.9); }
  .roundBtn.off { opacity: 0.45; }
  #menuBtn { bottom: calc(16px + env(safe-area-inset-bottom, 0px)); right: calc(16px + env(safe-area-inset-right, 0px)); }
  #settings {
    position: fixed; inset: 0;
    background: rgba(80, 50, 90, 0.45);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: none;
    align-items: center; justify-content: center;
    z-index: 10;
    touch-action: pan-y;
  }
  #settings.open { display: flex; }
  #settingsCard {
    background: #fff7fb;
    border-radius: 24px;
    box-shadow: 0 12px 48px rgba(80, 40, 90, 0.4);
    width: min(360px, 90vw);
    max-height: 82vh;
    overflow-y: auto;
    padding: 22px 20px 18px;
  }
  #settingsCard h2 {
    text-align: center; color: #8a5a7a; font-size: 22px; margin-bottom: 14px;
  }
  .optRow {
    display: flex; align-items: center; justify-content: space-between;
    background: #fff; border-radius: 14px;
    padding: 12px 14px; margin-bottom: 8px;
    box-shadow: 0 2px 8px rgba(180, 120, 160, 0.15);
    font-size: 15px; font-weight: 700; color: #8a5a7a;
  }
  .switch {
    width: 52px; height: 30px; border-radius: 999px; border: none;
    background: #e8d5e3; position: relative; cursor: pointer;
    transition: background 0.2s;
    flex-shrink: 0;
    touch-action: manipulation;
  }
  .switch::after {
    content: ''; position: absolute; top: 3px; left: 3px;
    width: 24px; height: 24px; border-radius: 50%;
    background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.18);
    transition: transform 0.2s;
  }
  .switch.on { background: #ff8fab; }
  .switch.on::after { transform: translateX(22px); }
  .cardBtn {
    display: block; width: 100%;
    border: none; border-radius: 14px;
    padding: 13px 14px; margin-top: 10px;
    font-size: 15px; font-weight: 800;
    cursor: pointer;
    touch-action: manipulation;
  }
  .cardBtn:active { transform: scale(0.97); }
  #openAlbum {
    background: linear-gradient(135deg, #ff8fab, #c98be0);
    color: #fff;
    box-shadow: 0 4px 14px rgba(200, 100, 180, 0.35);
  }
  #closeSettings {
    background: #f3e3ee; color: #a96a8e;
  }
  #album {
    position: fixed; inset: 0;
    background: rgba(80, 50, 90, 0.45);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: none;
    align-items: center; justify-content: center;
    z-index: 10;
    touch-action: pan-y;
  }
  #album.open { display: flex; }
  #albumCard {
    background: #fff7fb;
    border-radius: 24px;
    box-shadow: 0 12px 48px rgba(80, 40, 90, 0.4);
    width: min(440px, 92vw);
    max-height: 82vh;
    overflow-y: auto;
    padding: 22px 20px 16px;
  }
  #albumCard h2 {
    text-align: center; color: #8a5a7a; font-size: 22px; margin-bottom: 12px;
  }
  #albumStats {
    display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
    margin-bottom: 14px;
  }
  #albumStats span {
    background: #ffe3ef; color: #a96a8e; font-size: 12px; font-weight: 700;
    padding: 5px 10px; border-radius: 999px;
  }
  #albumGrid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  }
  .sticker {
    background: #fff; border-radius: 14px; padding: 10px 6px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(180, 120, 160, 0.15);
  }
  .sticker .em { font-size: 28px; line-height: 1.2; }
  .sticker .nm { font-size: 11px; font-weight: 800; color: #8a5a7a; margin-top: 2px; }
  .sticker .ds { font-size: 9.5px; color: #c98bb0; font-weight: 600; }
  .sticker.locked { opacity: 0.45; filter: grayscale(1); }
  .closeHint {
    text-align: center; color: #c98bb0; font-size: 12px; font-weight: 700;
    margin-top: 14px;
  }
  @media (max-width: 380px) {
    .badge .value { font-size: 20px; }
    #toast { font-size: 22px; padding: 12px 22px; }
    #combo { font-size: 24px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="badge"><div class="label">Score</div><div class="value" id="score">0</div><div class="sub" id="level">Niveau 1</div></div>
  <div class="badge"><div class="label">Record</div><div class="value" id="best">0</div><div class="sub" id="total">🫧 0</div></div>
</div>
<div id="combo"></div>
<div id="toast"></div>
<div id="hint">🫧 Tapote ou glisse sur les bulles !</div>
<button id="menuBtn" class="roundBtn" aria-label="Options">⚙️</button>
<div id="settings">
  <div id="settingsCard">
    <h2>⚙️ Options</h2>
    <div class="optRow"><span>🔊 Effets sonores</span><button class="switch" id="optSound" aria-label="Effets sonores"></button></div>
    <div class="optRow"><span>🎵 Musique</span><button class="switch" id="optMusic" aria-label="Musique"></button></div>
    <div class="optRow" id="optVibesRow"><span>📳 Vibrations</span><button class="switch" id="optVibes" aria-label="Vibrations"></button></div>
    <button id="openAlbum" class="cardBtn">🏅 Album de stickers</button>
    <button id="closeSettings" class="cardBtn">Fermer</button>
  </div>
</div>
<div id="album">
  <div id="albumCard">
    <h2>🏅 Album de stickers</h2>
    <div id="albumStats"></div>
    <div id="albumGrid"></div>
    <p class="closeHint">Touche n'importe où pour fermer</p>
  </div>
</div>
<script>
(() => {
  'use strict';

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const totalEl = document.getElementById('total');
  const levelEl = document.getElementById('level');
  const comboEl = document.getElementById('combo');
  const toastEl = document.getElementById('toast');
  const hintEl = document.getElementById('hint');
  const menuBtn = document.getElementById('menuBtn');
  const settingsEl = document.getElementById('settings');
  const optSound = document.getElementById('optSound');
  const optMusic = document.getElementById('optMusic');
  const optVibes = document.getElementById('optVibes');
  const optVibesRow = document.getElementById('optVibesRow');
  const openAlbumBtn = document.getElementById('openAlbum');
  const closeSettingsBtn = document.getElementById('closeSettings');
  const albumEl = document.getElementById('album');
  const albumStatsEl = document.getElementById('albumStats');
  const albumGridEl = document.getElementById('albumGrid');

  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    canvas.width = Math.max(1, Math.round(W * DPR));
    canvas.height = Math.max(1, Math.round(H * DPR));
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  resize();

  // ---------- Sauvegarde (tolérante au mode privé) ----------
  const store = {
    get(k, d) { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };

  // ---------- État ----------
  let score = 0;
  let displayedScore = 0;
  let best = +store.get('bullepop-best', 0) || 0;
  let totalPops = +store.get('bullepop-pops', 0) || 0;
  let maxCombo = +store.get('bullepop-maxcombo', 0) || 0;
  let maxLevel = +store.get('bullepop-maxlevel', 1) || 1;
  let starsCaught = +store.get('bullepop-stars', 0) || 0;
  let soundOn = store.get('bullepop-sound', '1') === '1';
  let musicOn = store.get('bullepop-music', '1') === '1';
  let vibesOn = store.get('bullepop-vibes', '1') === '1';
  let combo = 0;
  let lastPopTime = 0;
  let firstPop = false;
  let level = 1;
  let recordBeaten = false;
  let frenzyUntil = 0;   // pluie de bulles 💖 (x2)
  let feverUntil = 0;    // fièvre des bulles 🔥 (x3)
  let idSeq = 0;
  bestEl.textContent = best;
  totalEl.textContent = '🫧 ' + totalPops;

  const PASTELS = [
    { body: '#ffb3c6', cheek: '#ff8fab' }, // rose
    { body: '#a8d8ea', cheek: '#7ec4dd' }, // bleu ciel
    { body: '#c3aed6', cheek: '#a98bc4' }, // lilas
    { body: '#b5ead7', cheek: '#8fd6ba' }, // menthe
    { body: '#ffdac1', cheek: '#ffc29e' }, // pêche
    { body: '#fff5ba', cheek: '#f5e58a' }, // citron doux
  ];
  const GOLD = { body: '#ffd96a', cheek: '#ffb830' };
  const HEART = { body: '#ffa8c5', cheek: '#ff6f9c' };
  const RAINBOW = { body: '#ffffff', cheek: '#ff8fab' };

  const bubbles = [];
  const particles = [];
  const rings = [];
  const popups = [];
  const clouds = [];
  const stars = [];
  const chainQueue = [];
  const shootingStars = [];
  let nextStarAt = performance.now() + 12000 + Math.random() * 15000;

  for (let i = 0; i < 6; i++) {
    clouds.push({
      fx: Math.random(),
      fy: Math.random() * 0.65,
      r: 40 + Math.random() * 60,
      speed: 0.08 + Math.random() * 0.12,
      drift: 0,
    });
  }
  for (let i = 0; i < 50; i++) {
    stars.push({ fx: Math.random(), fy: Math.random() * 0.85, r: 0.6 + Math.random() * 1.6, ph: Math.random() * Math.PI * 2 });
  }

  // ---------- Album de stickers (succès, jamais punitifs) ----------
  const STICKERS = [
    { id: 'pop1',    em: '🫧', nm: 'Premier pop',     ds: 'Éclater une bulle' },
    { id: 'pop100',  em: '💯', nm: 'Centenaire',      ds: '100 bulles éclatées' },
    { id: 'pop1000', em: '🎉', nm: 'Millier moelleux', ds: '1000 bulles éclatées' },
    { id: 'combo5',  em: '🔥', nm: 'Enchaînement',    ds: 'Atteindre un combo x5' },
    { id: 'fever',   em: '🌟', nm: 'Fièvre des bulles', ds: 'Déclencher la fièvre x3' },
    { id: 'gold',    em: '👑', nm: 'Royale',          ds: 'Éclater une bulle dorée' },
    { id: 'rainbow', em: '🌈', nm: 'Arc-en-ciel',     ds: 'Réaction en chaîne' },
    { id: 'heart',   em: '💖', nm: 'Pluie d’amour', ds: 'Pluie de bulles' },
    { id: 'star',    em: '🌠', nm: 'Vœu exaucé',      ds: 'Attraper une étoile filante' },
    { id: 'lvl5',    em: '🌅', nm: 'Grand voyageur',  ds: 'Atteindre le niveau 5' },
    { id: 'night',   em: '🌙', nm: 'Oiseau de nuit',  ds: 'Voir la nuit étoilée' },
    { id: 'score5k', em: '🏆', nm: 'Champion·ne',     ds: 'Marquer 5000 points' },
  ];
  let unlocked = {};
  try { unlocked = JSON.parse(store.get('bullepop-stickers', '{}')) || {}; } catch (e) { unlocked = {}; }

  function unlock(id) {
    if (unlocked[id]) return;
    unlocked[id] = true;
    store.set('bullepop-stickers', JSON.stringify(unlocked));
    const s = STICKERS.find(x => x.id === id);
    if (s) {
      showToast('Sticker débloqué ! ' + s.em + ' ' + s.nm, 2000);
      playChime([784, 988, 1318], 0.09);
      buzz([10, 30, 10]);
    }
  }

  function renderAlbum() {
    const count = STICKERS.filter(s => unlocked[s.id]).length;
    albumStatsEl.innerHTML =
      '<span>🏆 Record ' + best + '</span>' +
      '<span>🫧 ' + totalPops + ' bulles</span>' +
      '<span>🔥 Combo max x' + Math.min(1 + Math.floor(Math.max(maxCombo - 1, 0) / 2), 5) + '</span>' +
      '<span>🌅 Niveau max ' + maxLevel + '</span>' +
      '<span>🌠 ' + starsCaught + ' étoile' + (starsCaught > 1 ? 's' : '') + '</span>' +
      '<span>🏅 ' + count + '/' + STICKERS.length + '</span>';
    albumGridEl.innerHTML = STICKERS.map(s =>
      '<div class="sticker' + (unlocked[s.id] ? '' : ' locked') + '">' +
      '<div class="em">' + (unlocked[s.id] ? s.em : '❔') + '</div>' +
      '<div class="nm">' + s.nm + '</div>' +
      '<div class="ds">' + s.ds + '</div></div>'
    ).join('');
  }
  albumEl.addEventListener('click', () => albumEl.classList.remove('open'));

  // ---------- Thèmes de ciel (changent à chaque niveau, purement cosmétique) ----------
  function hexToRgb(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  const THEMES = [
    { name: 'Aube rosée 🌸',        top: '#ffeef5', mid: '#fde2ef', bot: '#e3f0ff', cloud: 0.55, star: 0 },
    { name: 'Plein ciel ☁️',        top: '#cdebff', mid: '#e0f4ff', bot: '#fdf6e3', cloud: 0.85, star: 0 },
    { name: 'Coucher de soleil 🌅', top: '#ffd9a8', mid: '#ffc2cd', bot: '#e7b6e0', cloud: 0.5,  star: 0.2 },
    { name: 'Nuit étoilée 🌙',      top: '#33305e', mid: '#564b87', bot: '#8a6fae', cloud: 0.13, star: 1 },
  ].map(t => ({ name: t.name, top: hexToRgb(t.top), mid: hexToRgb(t.mid), bot: hexToRgb(t.bot), cloud: t.cloud, star: t.star }));

  const sky = {
    top: THEMES[0].top.slice(), mid: THEMES[0].mid.slice(), bot: THEMES[0].bot.slice(),
    cloud: THEMES[0].cloud, star: THEMES[0].star,
  };
  function lerpTo(arr, target, k) {
    for (let i = 0; i < 3; i++) arr[i] += (target[i] - arr[i]) * k;
  }
  function rgb(a) { return 'rgb(' + (a[0] | 0) + ',' + (a[1] | 0) + ',' + (a[2] | 0) + ')'; }

  // ---------- Audio (sons et musique générés, aucun fichier) ----------
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    updateMusic();
  }
  function tone(freq, when, dur, vol, type, attack) {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.001, when);
    g.gain.exponentialRampToValueAtTime(vol, when + (attack || 0.015));
    g.gain.exponentialRampToValueAtTime(0.001, when + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(when);
    o.stop(when + dur + 0.05);
  }
  function playPop(pitch) {
    if (!audioCtx || !soundOn) return;
    const t = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(pitch, t);
    o.frequency.exponentialRampToValueAtTime(pitch * 1.8, t + 0.08);
    g.gain.setValueAtTime(0.001, t);
    g.gain.exponentialRampToValueAtTime(0.15, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    o.connect(g).connect(audioCtx.destination);
    o.start(t);
    o.stop(t + 0.25);
  }
  function playChime(notes, vol) {
    if (!audioCtx || !soundOn) return;
    const t = audioCtx.currentTime;
    notes.forEach((f, i) => tone(f, t + i * 0.08, 0.32, vol || 0.09, 'triangle'));
  }
  function buzz(p) {
    if (!vibesOn) return;
    if (navigator.vibrate) { try { navigator.vibrate(p); } catch (e) {} }
  }

  // Berceuse générative : quelques notes pentatoniques au hasard, très douces.
  const SCALE = [261.63, 293.66, 329.63, 392.0, 440.0, 523.25, 587.33, 659.25];
  let musicTimer = null;
  let musicBeat = 0;
  function musicTick() {
    if (!audioCtx || !musicOn || document.hidden) return;
    const t = audioCtx.currentTime;
    musicBeat++;
    if (Math.random() < 0.75) {
      const n = SCALE[(Math.random() * SCALE.length) | 0];
      tone(n, t, 1.4, 0.035, 'triangle', 0.05);
      if (Math.random() < 0.35) {
        tone(SCALE[(Math.random() * SCALE.length) | 0], t + 0.45, 1.2, 0.028, 'triangle', 0.05);
      }
    }
    if (musicBeat % 6 === 0) {
      tone(130.81, t, 3.2, 0.022, 'sine', 0.4); // nappe grave très discrète
    }
  }
  function updateMusic() {
    if (musicOn && audioCtx && !musicTimer) {
      musicTimer = setInterval(musicTick, 1100);
      musicTick();
    } else if ((!musicOn || !audioCtx) && musicTimer) {
      clearInterval(musicTimer);
      musicTimer = null;
    }
  }

  // ---------- Menu d'options ----------
  function syncOpts() {
    optSound.classList.toggle('on', soundOn);
    optMusic.classList.toggle('on', musicOn);
    optVibes.classList.toggle('on', vibesOn);
  }
  syncOpts();
  if (!navigator.vibrate) optVibesRow.style.display = 'none'; // non supporté (ex. iPhone)
  menuBtn.addEventListener('click', () => {
    syncOpts();
    settingsEl.classList.add('open');
  });
  closeSettingsBtn.addEventListener('click', () => settingsEl.classList.remove('open'));
  settingsEl.addEventListener('click', (e) => {
    if (e && e.target === settingsEl) settingsEl.classList.remove('open');
  });
  optSound.addEventListener('click', () => {
    soundOn = !soundOn;
    store.set('bullepop-sound', soundOn ? '1' : '0');
    syncOpts();
    if (soundOn) { ensureAudio(); playChime([660, 880], 0.07); }
  });
  optMusic.addEventListener('click', () => {
    musicOn = !musicOn;
    store.set('bullepop-music', musicOn ? '1' : '0');
    syncOpts();
    ensureAudio();
  });
  optVibes.addEventListener('click', () => {
    vibesOn = !vibesOn;
    store.set('bullepop-vibes', vibesOn ? '1' : '0');
    syncOpts();
    if (vibesOn) buzz(15); // petit retour pour confirmer
  });
  openAlbumBtn.addEventListener('click', () => {
    settingsEl.classList.remove('open');
    renderAlbum();
    albumEl.classList.add('open');
  });

  // ---------- Bulles ----------
  // mode : 'rise' (monte depuis le bas), 'place' (apparaît sur place), 'fall' (pluie de bulles)
  function spawnBubble(mode) {
    let kind = 'normal';
    const roll = Math.random();
    if (roll < 0.05) kind = 'golden';
    else if (roll < 0.08) kind = 'rainbow';
    else if (roll < 0.10 && performance.now() > frenzyUntil) kind = 'heart';

    const special = kind !== 'normal';
    const r = special ? 26 + Math.random() * 8 : 24 + Math.random() * 24;
    const palette = kind === 'golden' ? GOLD : kind === 'heart' ? HEART : kind === 'rainbow' ? RAINBOW
      : PASTELS[(Math.random() * PASTELS.length) | 0];

    const b = {
      id: ++idSeq,
      x: r + Math.random() * Math.max(1, W - r * 2),
      y: 0,
      r, baseR: r,
      vy: 0,
      wobblePhase: Math.random() * Math.PI * 2,
      wobbleSpeed: 0.015 + Math.random() * 0.02,
      wobbleAmp: 0.5 + Math.random() * 0.8,
      palette, kind,
      bow: kind === 'normal' && Math.random() < 0.18, // petit nœud décoratif
      blink: 0,
      nextBlink: 120 + Math.random() * 240,
      birth: performance.now(),
    };
    if (mode === 'fall') {
      b.y = -r - 10;
      b.vy = 0.7 + Math.random() * 0.5;
    } else if (mode === 'place') {
      b.y = H * 0.14 + Math.random() * H * 0.62;
      b.vy = -(0.25 + Math.random() * 0.3);
    } else {
      b.y = H + r + 10;
      b.vy = -(0.7 + Math.random() * 0.7) * (kind === 'golden' ? 1.4 : 1);
    }
    bubbles.push(b);
    return b;
  }

  function spawnParticles(x, y, color, fancy) {
    if (particles.length > 320) return;
    const n = fancy ? 24 : 13;
    for (let i = 0; i < n; i++) {
      const a = (Math.PI * 2 * i) / n + Math.random() * 0.5;
      const sp = 1.5 + Math.random() * 3.5;
      particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 1,
        r: 2 + Math.random() * 4,
        life: 1,
        decay: 0.015 + Math.random() * 0.02,
        color: fancy && Math.random() < 0.5 ? '#fff3c4' : color,
        star: fancy || Math.random() < 0.25,
        rot: Math.random() * Math.PI * 2,
        vrot: (Math.random() - 0.5) * 0.2,
      });
    }
  }

  function sparkle(x, y, color, count, soft) {
    if (particles.length > 360) return;
    for (let i = 0; i < count; i++) {
      particles.push({
        x: x + (Math.random() - 0.5) * 14,
        y: y + (Math.random() - 0.5) * 14,
        vx: (Math.random() - 0.5) * 1.5,
        vy: -0.5 - Math.random(),
        r: 1.5 + Math.random() * 2,
        life: soft ? 0.5 : 0.7,
        decay: 0.04,
        color: color || '#ffffff',
        star: true,
        rot: Math.random() * Math.PI,
        vrot: 0.1,
      });
    }
  }

  function confettiRain() {
    const colors = ['#ffb3c6', '#a8d8ea', '#c3aed6', '#b5ead7', '#ffdac1', '#ffd96a'];
    for (let i = 0; i < 32; i++) {
      particles.push({
        x: Math.random() * W,
        y: -10 - Math.random() * 40,
        vx: (Math.random() - 0.5) * 1.2,
        vy: 1 + Math.random() * 2.2,
        r: 3 + Math.random() * 3.5,
        life: 1,
        decay: 0.004 + Math.random() * 0.005,
        color: colors[(Math.random() * colors.length) | 0],
        star: true,
        rot: Math.random() * Math.PI * 2,
        vrot: (Math.random() - 0.5) * 0.25,
      });
    }
  }

  function addPopup(x, y, text, color, big) {
    popups.push({ x: Math.min(Math.max(x, 40), W - 40), y, text, life: 1, color, big });
  }

  function showToast(text, ms) {
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toastEl.classList.remove('show'), ms || 1500);
  }

  // ---------- Bonus actifs ----------
  function bonusMult(now) {
    if (now < feverUntil) return 3;
    if (now < frenzyUntil) return 2;
    return 1;
  }

  // ---------- Pop ! ----------
  function popBubble(b, chainIndex) {
    const idx = bubbles.indexOf(b);
    if (idx === -1) return;
    bubbles.splice(idx, 1);

    const now = performance.now();
    combo = (now - lastPopTime < 1700) ? Math.min(combo + 1, 12) : 1;
    lastPopTime = now;
    if (combo > maxCombo) { maxCombo = combo; store.set('bullepop-maxcombo', maxCombo); }
    const mult = Math.min(1 + Math.floor((combo - 1) / 2), 5); // x1 à x5
    if (mult >= 5) unlock('combo5');

    // fièvre des bulles : récompense des longs enchaînements, points x3
    if (combo >= 10 && now > feverUntil) {
      feverUntil = now + 6000;
      showToast('Fièvre des bulles ! 🔥 Points x3', 1800);
      playChime([659, 784, 988, 1318], 0.1);
      buzz([12, 40, 12]);
      unlock('fever');
    }
    const bonus = bonusMult(now);

    const base = b.kind === 'golden' ? 50
      : b.kind === 'heart' ? 20
      : b.kind === 'rainbow' ? 15
      : Math.max(1, Math.round((52 - b.baseR) / 7) + 1);
    const points = base * mult * bonus;
    score += points;
    totalPops++;

    const fancy = b.kind !== 'normal';
    spawnParticles(b.x, b.y, b.kind === 'golden' ? '#ffd96a' : b.palette.body, fancy);
    rings.push({ x: b.x, y: b.y, r: b.baseR * 0.6, max: b.baseR * 2.4, life: 1, color: b.palette.cheek });
    addPopup(b.x, b.y - b.r, '+' + points, fancy ? '#ff9f1c' : b.palette.cheek, fancy);

    if (chainIndex !== undefined) {
      playPop(Math.min(1400, 380 + chainIndex * 55));
    } else {
      playPop(280 + (52 - b.baseR) * 11 + Math.random() * 50);
    }

    if (b.kind === 'golden') {
      playChime([880, 1174, 1568], 0.1);
      buzz([12, 40, 12]);
      unlock('gold');
    } else if (b.kind === 'rainbow') {
      // réaction en chaîne : toutes les bulles éclatent l'une après l'autre 🌈
      const others = bubbles.slice().sort((p, q) =>
        Math.hypot(p.x - b.x, p.y - b.y) - Math.hypot(q.x - b.x, q.y - b.y));
      others.forEach((ob, i) => chainQueue.push({ id: ob.id, at: now + 80 * (i + 1), index: i }));
      if (others.length > 2) showToast('Réaction en chaîne ! 🌈', 1400);
      buzz([12, 40, 12]);
      unlock('rainbow');
    } else if (b.kind === 'heart') {
      frenzyUntil = now + 6500;
      showToast('Pluie de bulles ! 💖 Points x2', 1800);
      playChime([523, 659, 784], 0.1);
      buzz([12, 40, 12]);
      unlock('heart');
    } else {
      buzz(8);
    }

    if (combo >= 3) {
      comboEl.textContent = 'Combo x' + mult + (bonus === 3 ? ' 🔥x3' : bonus === 2 ? ' 💖x2' : ' ✨');
      comboEl.classList.add('show');
      clearTimeout(comboEl._t);
      comboEl._t = setTimeout(() => comboEl.classList.remove('show'), 900);
    }

    if (score > best) {
      best = score;
      store.set('bullepop-best', best);
      bestEl.textContent = best;
      if (!recordBeaten && totalPops > 20) {
        recordBeaten = true;
        showToast('Nouveau record ! 🏆', 1800);
        playChime([659, 784, 1046], 0.1);
      }
    }
    store.set('bullepop-pops', totalPops);
    totalEl.textContent = '🫧 ' + totalPops;
    unlock('pop1');
    if (totalPops >= 100) unlock('pop100');
    if (totalPops >= 1000) unlock('pop1000');
    if (best >= 5000) unlock('score5k');

    // niveaux : toutes les 500 pts le ciel change, pure récompense
    const newLevel = Math.floor(score / 500) + 1;
    if (newLevel > level) {
      level = newLevel;
      levelEl.textContent = 'Niveau ' + level;
      if (level > maxLevel) { maxLevel = level; store.set('bullepop-maxlevel', maxLevel); }
      const theme = THEMES[(level - 1) % THEMES.length];
      showToast('Niveau ' + level + ' · ' + theme.name, 2000);
      confettiRain();
      playChime([523, 659, 784, 1046], 0.1);
      buzz([10, 30, 10, 30, 10]);
      if (level >= 5) unlock('lvl5');
      if ((level - 1) % THEMES.length === 3) unlock('night');
    }

    if (!firstPop) { firstPop = true; hintEl.style.opacity = '0'; }
  }

  function catchStar(s, idx) {
    shootingStars.splice(idx, 1);
    const now = performance.now();
    const mult = Math.min(1 + Math.floor(Math.max(combo - 1, 0) / 2), 5);
    const points = 100 * mult * bonusMult(now);
    score += points;
    starsCaught++;
    store.set('bullepop-stars', starsCaught);
    addPopup(s.x, s.y - 20, '+' + points, '#ffd96a', true);
    showToast('Vœu exaucé ! 🌠', 1600);
    spawnParticles(s.x, s.y, '#ffd96a', true);
    rings.push({ x: s.x, y: s.y, r: 14, max: 90, life: 1, color: '#ffd96a' });
    playChime([1046, 1318, 1568, 2093], 0.09);
    buzz([10, 30, 10]);
    unlock('star');
    if (score > best) {
      best = score;
      store.set('bullepop-best', best);
      bestEl.textContent = best;
    }
    nextStarAt = now + 18000 + Math.random() * 22000;
  }

  function popAt(px, py) {
    // étoile filante en premier (grosse zone, c'est un cadeau)
    for (let i = shootingStars.length - 1; i >= 0; i--) {
      const s = shootingStars[i];
      if (Math.hypot(s.x - px, s.y - py) < 44) { catchStar(s, i); return; }
    }
    // bulle la plus proche du doigt, marge généreuse : zéro frustration
    let hit = null, hitDist = Infinity;
    for (const b of bubbles) {
      const d = Math.hypot(b.x - px, b.y - py);
      if (d < b.r + 18 && d < hitDist) { hit = b; hitDist = d; }
    }
    if (hit) {
      popBubble(hit);
    } else {
      // un tap dans le vide fait quand même un petit scintillement, jamais de sanction
      sparkle(px, py, '#ffffff', 4);
    }
  }

  // glisser le doigt : tout éclate au passage ✨
  let lastTrailX = -999, lastTrailY = -999;
  function swipeAt(px, py) {
    for (let i = shootingStars.length - 1; i >= 0; i--) {
      const s = shootingStars[i];
      if (Math.hypot(s.x - px, s.y - py) < 44) { catchStar(s, i); return; }
    }
    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      if (Math.hypot(b.x - px, b.y - py) < b.r + 4) popBubble(b);
    }
    if (Math.hypot(px - lastTrailX, py - lastTrailY) > 16) {
      lastTrailX = px; lastTrailY = py;
      sparkle(px, py, '#fff0f7', 2, true);
    }
  }

  // ---------- Entrées (souris + multi-touch + glisser) ----------
  function onPress(e) {
    e.preventDefault();
    ensureAudio();
    popAt(e.clientX, e.clientY);
  }
  function onMove(e) {
    // doigt posé ou bouton de souris enfoncé
    if (e.pointerType === 'touch' || e.buttons) {
      e.preventDefault();
      swipeAt(e.clientX, e.clientY);
    }
  }
  if (window.PointerEvent) {
    canvas.addEventListener('pointerdown', onPress);
    canvas.addEventListener('pointermove', onMove);
  } else {
    canvas.addEventListener('mousedown', onPress);
    canvas.addEventListener('mousemove', (e) => { if (e.buttons) swipeAt(e.clientX, e.clientY); });
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      ensureAudio();
      for (const t of e.changedTouches) popAt(t.clientX, t.clientY);
    }, { passive: false });
    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      for (const t of e.changedTouches) swipeAt(t.clientX, t.clientY);
    }, { passive: false });
  }
  document.addEventListener('touchmove', (e) => {
    if (!(e.target && e.target.closest && e.target.closest('#album, #settings'))) e.preventDefault();
  }, { passive: false });
  document.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('visibilitychange', () => { lastTime = performance.now(); });

  // ---------- Dessin ----------
  function drawBackground(time, dt) {
    const target = THEMES[(level - 1) % THEMES.length];
    const k = Math.min(1, 0.025 * dt);
    lerpTo(sky.top, target.top, k);
    lerpTo(sky.mid, target.mid, k);
    lerpTo(sky.bot, target.bot, k);
    sky.cloud += (target.cloud - sky.cloud) * k;
    sky.star += (target.star - sky.star) * k;

    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, rgb(sky.top));
    g.addColorStop(0.55, rgb(sky.mid));
    g.addColorStop(1, rgb(sky.bot));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    if (sky.star > 0.02) {
      ctx.fillStyle = '#fff';
      for (const s of stars) {
        const tw = 0.45 + 0.55 * Math.sin(time * 0.002 + s.ph);
        ctx.globalAlpha = sky.star * tw * 0.9;
        ctx.beginPath();
        ctx.arc(s.fx * W, s.fy * H, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    ctx.fillStyle = 'rgba(255, 255, 255, ' + sky.cloud.toFixed(3) + ')';
    for (const cl of clouds) {
      cl.drift += cl.speed * dt;
      const x = ((cl.fx * W + cl.drift) % (W + cl.r * 4)) - cl.r * 2;
      const y = cl.fy * H;
      ctx.beginPath();
      ctx.arc(x, y, cl.r * 0.6, 0, Math.PI * 2);
      ctx.arc(x + cl.r * 0.5, y - cl.r * 0.25, cl.r * 0.45, 0, Math.PI * 2);
      ctx.arc(x + cl.r, y, cl.r * 0.55, 0, Math.PI * 2);
      ctx.fill();
    }

    const now = performance.now();
    if (now < frenzyUntil) {
      ctx.fillStyle = 'rgba(255, 150, 190, 0.07)';
      ctx.fillRect(0, 0, W, H);
    }
    if (now < feverUntil) {
      // halo arc-en-ciel qui tourne doucement sur les bords
      const hue = (time * 0.06) % 360;
      const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
      vg.addColorStop(0, 'hsla(' + hue + ', 90%, 70%, 0)');
      vg.addColorStop(1, 'hsla(' + hue + ', 90%, 70%, 0.22)');
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, W, H);
    }
  }

  function heartPath(s) {
    ctx.beginPath();
    ctx.moveTo(0, s * 0.45);
    ctx.bezierCurveTo(-s * 0.7, 0, -s * 0.55, -s * 0.5, 0, -s * 0.15);
    ctx.bezierCurveTo(s * 0.55, -s * 0.5, s * 0.7, 0, 0, s * 0.45);
    ctx.closePath();
  }

  function drawBubble(b, time) {
    const age = (time - b.birth) / 1000;
    const popIn = Math.min(1, age * 4);
    const ease = 1 - Math.pow(1 - popIn, 3);
    const wob = Math.sin(time * 0.003 + b.wobblePhase) * 0.06;
    const rx = b.r * ease * (1 + wob);
    const ry = b.r * ease * (1 - wob);
    if (rx < 1 || ry < 1) return;

    ctx.save();
    ctx.translate(b.x, b.y);

    if (b.kind === 'golden') {
      ctx.shadowColor = 'rgba(255, 200, 60, 0.8)';
      ctx.shadowBlur = 22;
    } else if (b.kind === 'heart') {
      ctx.shadowColor = 'rgba(255, 110, 160, 0.7)';
      ctx.shadowBlur = 18;
    }

    // corps
    ctx.beginPath();
    ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
    if (b.kind === 'rainbow') {
      const rg = ctx.createLinearGradient(-rx, -ry, rx, ry);
      rg.addColorStop(0, '#ffb3c6');
      rg.addColorStop(0.3, '#ffdac1');
      rg.addColorStop(0.55, '#b5ead7');
      rg.addColorStop(0.8, '#a8d8ea');
      rg.addColorStop(1, '#c3aed6');
      ctx.fillStyle = rg;
    } else {
      ctx.fillStyle = b.palette.body;
    }
    ctx.fill();
    ctx.shadowBlur = 0;

    // reflet de bulle
    ctx.beginPath();
    ctx.ellipse(-rx * 0.35, -ry * 0.4, rx * 0.22, ry * 0.14, -0.6, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
    ctx.fill();

    // visage kawaii
    const eyeY = -ry * 0.05;
    const eyeX = rx * 0.32;
    ctx.fillStyle = '#5a4a52';
    b.nextBlink--;
    if (b.nextBlink <= 0) { b.blink = 8; b.nextBlink = 150 + Math.random() * 250; }
    if (b.blink > 0) b.blink--;
    if (b.blink > 0) {
      ctx.lineWidth = Math.max(1.5, rx * 0.06);
      ctx.strokeStyle = '#5a4a52';
      ctx.lineCap = 'round';
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(s * eyeX - rx * 0.1, eyeY);
        ctx.lineTo(s * eyeX + rx * 0.1, eyeY);
        ctx.stroke();
      }
    } else {
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.arc(s * eyeX, eyeY, Math.max(2, rx * 0.09), 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // sourire
    ctx.beginPath();
    ctx.arc(0, ry * 0.18, rx * 0.16, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.lineWidth = Math.max(1.5, rx * 0.05);
    ctx.strokeStyle = '#5a4a52';
    ctx.lineCap = 'round';
    ctx.stroke();

    // joues roses
    ctx.fillStyle = b.palette.cheek;
    ctx.globalAlpha = 0.55;
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.ellipse(s * rx * 0.55, ry * 0.18, rx * 0.13, ry * 0.09, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // accessoires
    if (b.kind === 'golden') {
      ctx.fillStyle = '#ffb830';
      ctx.beginPath();
      const cw = rx * 0.5, ch = ry * 0.32, cy = -ry - ch * 0.2;
      ctx.moveTo(-cw, cy);
      ctx.lineTo(-cw, cy - ch);
      ctx.lineTo(-cw * 0.5, cy - ch * 0.45);
      ctx.lineTo(0, cy - ch * 1.15);
      ctx.lineTo(cw * 0.5, cy - ch * 0.45);
      ctx.lineTo(cw, cy - ch);
      ctx.lineTo(cw, cy);
      ctx.closePath();
      ctx.fill();
    } else if (b.kind === 'heart') {
      ctx.save();
      ctx.translate(rx * 0.55, -ry * 0.95);
      ctx.rotate(0.3);
      ctx.fillStyle = '#ff6f9c';
      heartPath(rx * 0.32);
      ctx.fill();
      ctx.restore();
    } else if (b.kind === 'rainbow') {
      for (let i = 0; i < 3; i++) {
        const a = time * 0.003 + (i * Math.PI * 2) / 3;
        const sx = Math.cos(a) * rx * 1.25;
        const sy = Math.sin(a) * ry * 1.25;
        ctx.globalAlpha = 0.7 + 0.3 * Math.sin(time * 0.01 + i);
        drawStarShape(sx, sy, 3.5, a, '#fff');
        ctx.globalAlpha = 1;
      }
    } else if (b.bow) {
      // petit nœud sur le côté
      ctx.save();
      ctx.translate(-rx * 0.62, -ry * 0.72);
      ctx.rotate(-0.5);
      ctx.fillStyle = b.palette.cheek;
      const bs = rx * 0.22;
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(-bs, -bs * 0.7); ctx.lineTo(-bs, bs * 0.7); ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(bs, -bs * 0.7); ctx.lineTo(bs, bs * 0.7); ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.arc(0, 0, bs * 0.32, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    ctx.restore();
  }

  function drawStarShape(x, y, r, rot, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.fillStyle = color;
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = (i * 4 * Math.PI) / 5 - Math.PI / 2;
      ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // ---------- Boucle ----------
  let spawnTimer = 0;
  let frenzySpawnTimer = 0;
  let lastTime = performance.now();

  function frame(time) {
    const dt = Math.min((time - lastTime) / 16.67, 3);
    lastTime = time;
    const now = performance.now();

    drawBackground(time, dt);

    // --- apparitions : l'écran n'est jamais vide ---
    const target = Math.min(16, 8 + Math.floor(score / 250)) + (now < feverUntil ? 4 : 0);
    spawnTimer -= dt;
    if (spawnTimer <= 0 && bubbles.length < target) {
      spawnBubble(Math.random() < 0.45 ? 'place' : 'rise');
      spawnTimer = 10 + Math.random() * 14;
    }
    // filet de sécurité : si presque tout a éclaté, on en fait réapparaître sur place
    while (bubbles.length < 5) spawnBubble('place');

    // pluie de bulles pendant la frénésie 💖
    if (now < frenzyUntil) {
      frenzySpawnTimer -= dt;
      if (frenzySpawnTimer <= 0 && bubbles.length < 26) {
        spawnBubble('fall');
        frenzySpawnTimer = 9 + Math.random() * 8;
      }
    }

    // étoile filante 🌠
    if (now >= nextStarAt && shootingStars.length === 0) {
      const fromLeft = Math.random() < 0.5;
      shootingStars.push({
        x: fromLeft ? -40 : W + 40,
        y: H * (0.08 + Math.random() * 0.25),
        vx: (fromLeft ? 1 : -1) * (4.5 + Math.random() * 2.5),
        vy: 0.5 + Math.random() * 0.5,
        rot: 0,
      });
      nextStarAt = now + 18000 + Math.random() * 22000;
    }
    for (let i = shootingStars.length - 1; i >= 0; i--) {
      const s = shootingStars[i];
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.rot += 0.12 * dt;
      if (particles.length < 360) {
        particles.push({
          x: s.x - s.vx * 2, y: s.y - s.vy * 2,
          vx: -s.vx * 0.08, vy: 0.1,
          r: 1.5 + Math.random() * 2.5,
          life: 0.8, decay: 0.03,
          color: Math.random() < 0.5 ? '#ffd96a' : '#fff3c4',
          star: Math.random() < 0.4,
          rot: Math.random() * Math.PI, vrot: 0.1,
        });
      }
      if (s.x < -60 || s.x > W + 60 || s.y > H + 40) { shootingStars.splice(i, 1); continue; }
      ctx.save();
      ctx.shadowColor = 'rgba(255, 217, 106, 0.9)';
      ctx.shadowBlur = 18;
      drawStarShape(s.x, s.y, 14, s.rot, '#ffd96a');
      ctx.shadowBlur = 0;
      drawStarShape(s.x, s.y, 7, -s.rot * 0.7, '#fff7d6');
      ctx.restore();
    }

    // réaction en chaîne 🌈
    for (let i = chainQueue.length - 1; i >= 0; i--) {
      const c = chainQueue[i];
      if (now >= c.at) {
        chainQueue.splice(i, 1);
        const b = bubbles.find(bb => bb.id === c.id);
        if (b) popBubble(b, c.index);
      }
    }

    // --- bulles ---
    // légère répulsion pour qu'elles ne s'empilent pas
    for (let i = 0; i < bubbles.length; i++) {
      for (let j = i + 1; j < bubbles.length; j++) {
        const a = bubbles[i], c = bubbles[j];
        const dx = c.x - a.x, dy = c.y - a.y;
        const d = Math.hypot(dx, dy);
        const min = (a.r + c.r) * 0.9;
        if (d > 0.01 && d < min) {
          const push = (min - d) * 0.02 * dt;
          const nx = dx / d, ny = dy / d;
          a.x -= nx * push; a.y -= ny * push * 0.4;
          c.x += nx * push; c.y += ny * push * 0.4;
        }
      }
    }
    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      b.wobblePhase += b.wobbleSpeed * dt;
      b.x += Math.sin(b.wobblePhase) * b.wobbleAmp * dt;
      b.y += b.vy * dt;
      if (b.x < b.r) b.x = b.r;
      if (b.x > W - b.r) b.x = W - b.r;
      // elle s'envole ou se pose, c'est tout — aucune pénalité
      if (b.y < -b.r * 2 || b.y > H + b.r * 2.5) { bubbles.splice(i, 1); continue; }
      drawBubble(b, time);
    }

    // --- anneaux de pop ---
    for (let i = rings.length - 1; i >= 0; i--) {
      const ring = rings[i];
      ring.r += (ring.max - ring.r) * 0.18 * dt;
      ring.life -= 0.05 * dt;
      if (ring.life <= 0) { rings.splice(i, 1); continue; }
      ctx.globalAlpha = ring.life * 0.7;
      ctx.strokeStyle = ring.color;
      ctx.lineWidth = 3 * ring.life;
      ctx.beginPath();
      ctx.arc(ring.x, ring.y, ring.r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // --- particules ---
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 0.05 * dt;
      p.rot += p.vrot * dt;
      p.life -= p.decay * dt;
      if (p.life <= 0 || p.y > H + 20) { particles.splice(i, 1); continue; }
      ctx.globalAlpha = Math.min(1, p.life);
      if (p.star) {
        drawStarShape(p.x, p.y, p.r * Math.min(1, p.life) * 1.6, p.rot, p.color);
      } else {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * Math.min(1, p.life), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // --- popups "+N" ---
    for (let i = popups.length - 1; i >= 0; i--) {
      const p = popups[i];
      p.y -= 0.8 * dt;
      p.life -= 0.02 * dt;
      if (p.life <= 0) { popups.splice(i, 1); continue; }
      ctx.globalAlpha = Math.min(1, p.life * 2);
      ctx.font = '800 ' + (p.big ? 30 : 22) + 'px "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.lineWidth = 4;
      ctx.strokeText(p.text, p.x, p.y);
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, p.x, p.y);
      ctx.globalAlpha = 1;
    }

    // score animé en douceur
    if (displayedScore !== score) {
      displayedScore += Math.ceil((score - displayedScore) * 0.2);
      if (Math.abs(score - displayedScore) < 1) displayedScore = score;
      scoreEl.textContent = displayedScore;
    }

    requestAnimationFrame(frame);
  }

  // quelques bulles dès le départ, réparties à l'écran
  for (let i = 0; i < 8; i++) {
    const b = spawnBubble('place');
    b.birth = performance.now() - 1000; // déjà visibles, pas d'animation d'apparition
    b.y = H * 0.12 + (i / 8) * H * 0.7 + Math.random() * 40;
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
