<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffeef5">
<title>Bulle Pop</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='%239fd4ee'/%3E%3Cellipse cx='8.5' cy='8' rx='3' ry='1.8' fill='%23fff' opacity='.85' transform='rotate(-30 8.5 8)'/%3E%3C/svg%3E">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --ink: #7c4f6d;
    --ink-soft: #c391b1;
    --pink: #ff8fab;
    --purple: #c98be0;
    --glass: rgba(255, 255, 255, 0.62);
    --glass-edge: rgba(255, 255, 255, 0.78);
    --shadow: 0 8px 28px rgba(150, 90, 140, 0.18);
  }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
    font-family: ui-rounded, 'SF Pro Rounded', 'Hiragino Maru Gothic ProN',
      'Arial Rounded MT Bold', 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    background: #ffeef5;
  }
  canvas { display: block; width: 100%; height: 100%; cursor: pointer; }
  .ic {
    display: inline-block;
    width: 18px; height: 18px;
    vertical-align: -0.18em;
    flex-shrink: 0;
  }

  /* ----- HUD ----- */
  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 10px;
    padding: calc(10px + env(safe-area-inset-top, 0px))
             calc(14px + env(safe-area-inset-right, 0px))
             0
             calc(14px + env(safe-area-inset-left, 0px));
    pointer-events: none;
  }
  .chip {
    display: flex; align-items: center; gap: 6px;
    margin-top: 8px;
    background: var(--glass);
    backdrop-filter: blur(14px) saturate(1.3);
    -webkit-backdrop-filter: blur(14px) saturate(1.3);
    border: 1px solid var(--glass-edge);
    border-radius: 999px;
    padding: 8px 13px;
    box-shadow: var(--shadow);
    font-size: 13px; font-weight: 800; color: var(--ink);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  #scoreCard {
    background: var(--glass);
    backdrop-filter: blur(14px) saturate(1.3);
    -webkit-backdrop-filter: blur(14px) saturate(1.3);
    border: 1px solid var(--glass-edge);
    border-radius: 22px;
    padding: 9px 22px 12px;
    box-shadow: var(--shadow);
    text-align: center;
    min-width: 148px;
    transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  #scoreCard.bump { transform: scale(1.07); }
  #scoreCard .label {
    font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase;
    color: var(--ink-soft); font-weight: 800;
  }
  #scoreCard .value {
    font-size: 31px; font-weight: 800; color: var(--ink);
    line-height: 1.08;
    font-variant-numeric: tabular-nums;
  }
  #lvlbarTrack {
    height: 5px; border-radius: 999px;
    background: rgba(195, 145, 177, 0.25);
    margin-top: 7px; overflow: hidden;
  }
  #lvlbar {
    height: 100%; width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--pink), var(--purple));
    transition: width 0.25s ease;
  }

  /* ----- combo & toast ----- */
  #combo {
    position: fixed; top: calc(112px + env(safe-area-inset-top, 0px));
    left: 50%; transform: translateX(-50%) scale(0);
    display: flex; align-items: center; gap: 6px;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    color: #fff;
    font-size: 17px; font-weight: 800;
    padding: 7px 16px; border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.45);
    box-shadow: 0 6px 22px rgba(255, 143, 171, 0.45);
    transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
    white-space: nowrap;
  }
  #combo.show { transform: translateX(-50%) scale(1); }
  #combo .ic { width: 20px; height: 20px; }
  #toast {
    position: fixed; top: 32%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    display: flex; align-items: center; justify-content: center; gap: 10px;
    font-size: 24px; font-weight: 800; color: #fff;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    padding: 14px 26px; border-radius: 26px;
    border: 1px solid rgba(255, 255, 255, 0.45);
    box-shadow: 0 16px 44px rgba(200, 100, 180, 0.45);
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
    width: max-content; max-width: 88vw;
    text-align: center;
  }
  #toast.show { transform: translate(-50%, -50%) scale(1); }
  #toast .ic { width: 26px; height: 26px; }
  #toast span { line-height: 1.25; }

  #comboBar {
    position: fixed; top: calc(150px + env(safe-area-inset-top, 0px));
    left: 50%; transform: translateX(-50%);
    width: 64px; height: 4px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.55);
    overflow: hidden;
    opacity: 0; transition: opacity 0.25s;
    pointer-events: none;
  }
  #comboFill {
    display: block; height: 100%; width: 100%;
    background: linear-gradient(90deg, var(--pink), var(--purple));
    border-radius: 999px;
  }
  #quest {
    position: fixed;
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    left: calc(16px + env(safe-area-inset-left, 0px));
    display: flex; align-items: center; gap: 7px;
    background: var(--glass);
    backdrop-filter: blur(14px) saturate(1.3);
    -webkit-backdrop-filter: blur(14px) saturate(1.3);
    border: 1px solid var(--glass-edge);
    border-radius: 999px;
    padding: 10px 14px;
    box-shadow: var(--shadow);
    color: var(--ink); font-size: 13px; font-weight: 800;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    opacity: 0; transform: translateY(8px);
    transition: opacity 0.3s, transform 0.3s;
    pointer-events: none;
  }
  #quest.show { opacity: 1; transform: none; }

  /* ----- indice & boutons ----- */
  #hint {
    position: fixed; bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    display: flex; align-items: center; gap: 8px;
    background: var(--glass);
    backdrop-filter: blur(14px) saturate(1.3);
    -webkit-backdrop-filter: blur(14px) saturate(1.3);
    border: 1px solid var(--glass-edge);
    border-radius: 999px;
    padding: 10px 18px;
    box-shadow: var(--shadow);
    color: var(--ink); font-size: 14px; font-weight: 700;
    pointer-events: none;
    white-space: nowrap;
    animation: floaty 2.6s ease-in-out infinite;
    transition: opacity 1s;
  }
  @keyframes floaty {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(-6px); }
  }
  .roundBtn {
    position: fixed;
    width: 50px; height: 50px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--glass-edge);
    border-radius: 50%;
    background: var(--glass);
    backdrop-filter: blur(14px) saturate(1.3);
    -webkit-backdrop-filter: blur(14px) saturate(1.3);
    box-shadow: var(--shadow);
    cursor: pointer;
    touch-action: manipulation;
    transition: transform 0.12s;
  }
  .roundBtn:active { transform: scale(0.88); }
  #menuBtn { bottom: calc(16px + env(safe-area-inset-bottom, 0px)); right: calc(16px + env(safe-area-inset-right, 0px)); }

  /* ----- panneaux ----- */
  #settings, #album {
    position: fixed; inset: 0;
    background: rgba(70, 40, 80, 0.42);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
    opacity: 0; visibility: hidden;
    transition: opacity 0.25s ease, visibility 0.25s ease;
    touch-action: pan-y;
    padding: 18px;
  }
  #settings.open, #album.open { opacity: 1; visibility: visible; }
  .card {
    position: relative;
    background: linear-gradient(180deg, #fffafd, #fff0f7);
    border: 1px solid rgba(255, 255, 255, 0.85);
    border-radius: 28px;
    box-shadow: 0 24px 64px rgba(80, 40, 90, 0.38);
    width: min(420px, 100%);
    max-height: 84vh;
    overflow-y: auto;
    padding: 24px 20px 20px;
    transform: translateY(26px) scale(0.96);
    transition: transform 0.3s cubic-bezier(0.34, 1.4, 0.64, 1);
  }
  .open .card { transform: translateY(0) scale(1); }
  .card h2 {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-size: 21px;
    background: linear-gradient(135deg, #f0709a, #a86fd0);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 16px;
  }
  .closeX {
    position: absolute; top: 14px; right: 14px;
    width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    border: none; border-radius: 50%;
    background: rgba(200, 145, 185, 0.16);
    color: #a96a8e;
    font-size: 16px; font-weight: 800; line-height: 1;
    font-family: inherit;
    cursor: pointer;
    touch-action: manipulation;
  }
  .closeX:active { transform: scale(0.9); }
  .optRow {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(255, 255, 255, 0.85);
    border: 1px solid #ffe4f0;
    border-radius: 16px;
    padding: 13px 14px;
    margin-bottom: 10px;
    font-size: 15px; font-weight: 700; color: var(--ink);
  }
  .optRow span { display: flex; align-items: center; gap: 9px; }
  .switch {
    width: 50px; height: 30px; border-radius: 999px; border: none;
    background: #ecdce8;
    position: relative; cursor: pointer;
    transition: background 0.25s;
    flex-shrink: 0;
    touch-action: manipulation;
  }
  .switch::after {
    content: ''; position: absolute; top: 3px; left: 3px;
    width: 24px; height: 24px; border-radius: 50%;
    background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    transition: transform 0.22s cubic-bezier(0.34, 1.4, 0.64, 1);
  }
  .switch.on { background: linear-gradient(135deg, var(--pink), var(--purple)); }
  .switch.on::after { transform: translateX(20px); }
  .cardBtn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%;
    border: none; border-radius: 16px;
    padding: 14px;
    margin-top: 12px;
    font-size: 15px; font-weight: 800;
    font-family: inherit;
    cursor: pointer;
    touch-action: manipulation;
    transition: transform 0.12s;
  }
  .cardBtn:active { transform: scale(0.97); }
  #openAlbum {
    background: linear-gradient(135deg, var(--pink), var(--purple));
    color: #fff;
    box-shadow: 0 8px 22px rgba(200, 100, 180, 0.35);
  }
  #albumStats {
    display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
    margin-bottom: 14px;
  }
  #albumStats span {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(255, 230, 241, 0.9);
    border: 1px solid #ffd9ea;
    color: #a96a8e; font-size: 12px; font-weight: 800;
    padding: 5px 10px; border-radius: 999px;
  }
  #albumGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .sticker {
    background: rgba(255, 255, 255, 0.9);
    border: 1px solid #ffe4f0;
    border-radius: 18px;
    padding: 12px 6px 10px;
    text-align: center;
  }
  .sticker .em {
    width: 46px; height: 46px;
    margin: 0 auto 6px;
    display: flex; align-items: center; justify-content: center;
    background: #fff0f7;
    border: 1px solid #ffe4f0;
    border-radius: 50%;
  }
  .sticker .nm { font-size: 11.5px; font-weight: 800; color: var(--ink); margin-top: 2px; }
  .sticker .ds { font-size: 9.5px; color: var(--ink-soft); font-weight: 600; }
  .sticker.locked {
    opacity: 0.6; filter: grayscale(0.85);
    border-style: dashed; border-color: #e6ccdb;
    background: rgba(255, 255, 255, 0.55);
  }
  /* ----- habillages par monde ----- */
  body.pixelMode {
    font-family: 'Courier New', Courier, monospace;
    --glass: #fff7fb;
    --glass-edge: #5a4a52;
    --shadow: 4px 4px 0 rgba(90, 74, 82, 0.25);
  }
  body.pixelMode .chip, body.pixelMode #scoreCard, body.pixelMode #combo, body.pixelMode #comboBar,
  body.pixelMode #toast, body.pixelMode #hint, body.pixelMode #quest, body.pixelMode .roundBtn,
  body.pixelMode .card, body.pixelMode .optRow, body.pixelMode .switch, body.pixelMode .switch::after,
  body.pixelMode .cardBtn, body.pixelMode .closeX, body.pixelMode #albumStats span,
  body.pixelMode .sticker, body.pixelMode .sticker .em, body.pixelMode #lvlbarTrack, body.pixelMode #lvlbar {
    border-radius: 0 !important;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }
  body.neonMode {
    --glass: rgba(28, 14, 52, 0.6);
    --glass-edge: rgba(140, 225, 255, 0.4);
    --ink: #eef6ff;
    --ink-soft: #9fb4e0;
    --shadow: 0 8px 28px rgba(255, 80, 220, 0.3);
  }
  @media (max-width: 380px) {
    #scoreCard .value { font-size: 26px; }
    #scoreCard { min-width: 126px; }
    .chip { font-size: 12px; padding: 7px 11px; }
    #toast { font-size: 19px; padding: 11px 20px; }
    #albumGrid { gap: 8px; }
  }
</style>
</head>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('c');
  const mainCtx = canvas.getContext('2d');
  let ctx = mainCtx; // bascule vers un canvas basse résolution pour le thème pixel art
  const pixCanvas = document.createElement('canvas');
  const pixCtx = pixCanvas.getContext('2d');
  const PIX = 5; // taille des « gros pixels »

  // icône SVG réutilisable (définie dans le bloc <defs> de la page)
  function ic(name, px) {
    return '<svg class="ic" style="width:' + px + 'px;height:' + px + 'px"><use href="#i-' + name + '"/></svg>';
  }
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const scoreCard = document.getElementById('scoreCard');
  const lvlbarEl = document.getElementById('lvlbar');
  const closeAlbumBtn = document.getElementById('closeAlbum');
  const questEl = document.getElementById('quest');
  const comboBarEl = document.getElementById('comboBar');
  const comboFillEl = document.getElementById('comboFill');
  const levelEl = document.getElementById('level');
  const comboEl = document.getElementById('combo');
  const toastEl = document.getElementById('toast');
  const hintEl = document.getElementById('hint');
  const menuBtn = document.getElementById('menuBtn');
  const settingsEl = document.getElementById('settings');
  const optSound = document.getElementById('optSound');
  const optMusic = document.getElementById('optMusic');
  const optVibes = document.getElementById('optVibes');
  const optVibesRow = document.getElementById('optVibesRow');
  const openAlbumBtn = document.getElementById('openAlbum');
  const closeSettingsBtn = document.getElementById('closeSettings');
  const albumEl = document.getElementById('album');
  const albumStatsEl = document.getElementById('albumStats');
  const albumGridEl = document.getElementById('albumGrid');

  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    canvas.width = Math.max(1, Math.round(W * DPR));
    canvas.height = Math.max(1, Math.round(H * DPR));
    mainCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  resize();

  // ---------- Sauvegarde (tolérante au mode privé) ----------
  const store = {
    get(k, d) { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };

  // ---------- État ----------
  let score = 0;
  let displayedScore = 0;
  let best = +store.get('bullepop-best', 0) || 0;
  let totalPops = +store.get('bullepop-pops', 0) || 0;
  let maxCombo = +store.get('bullepop-maxcombo', 0) || 0;
  let maxLevel = +store.get('bullepop-maxlevel', 1) || 1;
  let starsCaught = +store.get('bullepop-stars', 0) || 0;
  let soundOn = store.get('bullepop-sound', '1') === '1';
  let musicOn = store.get('bullepop-music', '1') === '1';
  let vibesOn = store.get('bullepop-vibes', '1') === '1';
  let combo = 0;
  let lastPopTime = 0;
  let firstPop = false;
  let level = 1;
  let recordBeaten = false;
  let frenzyUntil = 0;   // pluie de bulles (x2)
  let feverUntil = 0;    // fièvre des bulles (x3)
  let idSeq = 0;
  let quest = null;
  let questCooldown = 300; // ~5 s après le premier pop
  let questsDone = +store.get('bullepop-quests', 0) || 0;
  const todayStr = new Date().toISOString().slice(0, 10);
  let giftPending = store.get('bullepop-day', '') !== todayStr;
  bestEl.textContent = best;

  // seuil cumulé de points pour finir le niveau n (paliers de plus en plus longs : 750, 1100, 1450…)
  function cumulAt(n) { return n * 750 + 175 * n * (n - 1); }

  const PASTELS = [
    { body: '#ffb3c6', cheek: '#ff8fab' }, // rose
    { body: '#a8d8ea', cheek: '#7ec4dd' }, // bleu ciel
    { body: '#c3aed6', cheek: '#a98bc4' }, // lilas
    { body: '#b5ead7', cheek: '#8fd6ba' }, // menthe
    { body: '#ffdac1', cheek: '#ffc29e' }, // pêche
    { body: '#fff5ba', cheek: '#f5e58a' }, // citron doux
  ];
  const GOLD = { body: '#ffd96a', cheek: '#ffb830' };
  const HEART = { body: '#ffa8c5', cheek: '#ff6f9c' };
  const RAINBOW = { body: '#ffffff', cheek: '#ff8fab' };

  const bubbles = [];
  const particles = [];
  const rings = [];
  const popups = [];
  const clouds = [];
  const stars = [];
  const chainQueue = [];
  const shootingStars = [];
  let nextStarAt = performance.now() + 12000 + Math.random() * 15000;

  for (let i = 0; i < 6; i++) {
    clouds.push({
      fx: Math.random(),
      fy: Math.random() * 0.65,
      r: 40 + Math.random() * 60,
      speed: 0.08 + Math.random() * 0.12,
      drift: 0,
    });
  }
  for (let i = 0; i < 50; i++) {
    stars.push({ fx: Math.random(), fy: Math.random() * 0.85, r: 0.6 + Math.random() * 1.6, ph: Math.random() * Math.PI * 2 });
  }

  // ---------- Album de stickers (succès, jamais punitifs) ----------
  const STICKERS = [
    { id: 'pop1',    icon: 'bubble',    nm: 'Premier pop',       ds: 'Éclater une bulle' },
    { id: 'pop100',  icon: 'hundred',   nm: 'Centenaire',        ds: '100 bulles éclatées' },
    { id: 'pop1000', icon: 'party',     nm: 'Millier moelleux',  ds: '1000 bulles éclatées' },
    { id: 'combo5',  icon: 'flame',     nm: 'Enchaînement',      ds: 'Atteindre un combo x5' },
    { id: 'fever',   icon: 'sparkle',   nm: 'Fièvre des bulles', ds: 'Déclencher la fièvre x3' },
    { id: 'gold',    icon: 'crown',     nm: 'Royale',            ds: 'Éclater une bulle dorée' },
    { id: 'rainbow', icon: 'rainbow',   nm: 'Arc-en-ciel',       ds: 'Réaction en chaîne' },
    { id: 'heart',   icon: 'heart',     nm: 'Pluie d’amour',   ds: 'Pluie de bulles' },
    { id: 'star',    icon: 'shootstar', nm: 'Vœu exaucé',        ds: 'Attraper une étoile filante' },
    { id: 'lvl5',    icon: 'sun',       nm: 'Grand voyageur',    ds: 'Atteindre le niveau 5' },
    { id: 'night',   icon: 'moon',      nm: 'Oiseau de nuit',    ds: 'Voir la nuit étoilée' },
    { id: 'score5k', icon: 'trophy',    nm: 'Champion·ne',       ds: 'Marquer 5000 points' },
    { id: 'quest5',  icon: 'target',    nm: 'Touche-à-tout',     ds: 'Réussir 5 petits défis' },
    { id: 'gift',    icon: 'gift',      nm: 'Bien le bonjour',   ds: 'Recevoir le cadeau du jour' },
  ];
  let unlocked = {};
  try { unlocked = JSON.parse(store.get('bullepop-stickers', '{}')) || {}; } catch (e) { unlocked = {}; }

  function unlock(id) {
    if (unlocked[id]) return;
    unlocked[id] = true;
    store.set('bullepop-stickers', JSON.stringify(unlocked));
    const s = STICKERS.find(x => x.id === id);
    if (s) {
      showToast('Sticker : ' + s.nm, 2000, s.icon);
      playChime([784, 988, 1318], 0.09);
      buzz([10, 30, 10]);
    }
  }

  function renderAlbum() {
    const count = STICKERS.filter(s => unlocked[s.id]).length;
    albumStatsEl.innerHTML =
      '<span>' + ic('trophy', 13) + ' Record ' + best + '</span>' +
      '<span>' + ic('bubble', 13) + ' ' + totalPops + ' bulle' + (totalPops > 1 ? 's' : '') + '</span>' +
      '<span>' + ic('flame', 13) + ' Combo max x' + Math.min(1 + Math.floor(maxCombo / 4), 5) + '</span>' +
      '<span>' + ic('sun', 13) + ' Niveau max ' + maxLevel + '</span>' +
      '<span>' + ic('shootstar', 13) + ' ' + starsCaught + ' étoile' + (starsCaught > 1 ? 's' : '') + '</span>' +
      '<span>' + ic('target', 13) + ' ' + questsDone + ' défi' + (questsDone > 1 ? 's' : '') + '</span>' +
      '<span>' + ic('medal', 13) + ' ' + count + '/' + STICKERS.length + '</span>';
    albumGridEl.innerHTML = STICKERS.map(s =>
      '<div class="sticker' + (unlocked[s.id] ? '' : ' locked') + '">' +
      '<div class="em">' + ic(unlocked[s.id] ? s.icon : 'lock', 30) + '</div>' +
      '<div class="nm">' + s.nm + '</div>' +
      '<div class="ds">' + s.ds + '</div></div>'
    ).join('');
  }
  albumEl.addEventListener('click', (e) => {
    if (e && e.target === albumEl) {
      albumEl.classList.remove('open');
      whoosh(900, 300, 0.16, 0.013);
    }
  });
  closeAlbumBtn.addEventListener('click', () => {
    albumEl.classList.remove('open');
    whoosh(900, 300, 0.16, 0.013);
  });

  // ---------- Thèmes de ciel (changent à chaque niveau, purement cosmétique) ----------
  function hexToRgb(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  function shade(hex, amt) { // mélange une couleur hex vers le blanc (amt>0) ou le noir (amt<0)
    const c = hexToRgb(hex);
    const t = amt > 0 ? 255 : 0, q = Math.abs(amt);
    return 'rgb(' + c.map(v => Math.round(v + (t - v) * q)).join(',') + ')';
  }
  const THEMES = [
    { name: 'Aube rosée',        icon: 'flower', top: '#ffeef5', mid: '#fde2ef', bot: '#e3f0ff', cloud: 0.55, star: 0,    pal: 'pastel', glow: 0 },
    { name: 'Plein ciel',        icon: 'cloud',  top: '#cdebff', mid: '#e0f4ff', bot: '#fdf6e3', cloud: 0.85, star: 0,    pal: 'pastel', glow: 0 },
    { name: 'Coucher de soleil', icon: 'sun',    top: '#ffc88f', mid: '#ffb3ad', bot: '#d8a0d8', cloud: 0.4,  star: 0.25, pal: 'pastel', glow: 0.25 },
    { name: 'Nuit étoilée',      icon: 'moon',   top: '#33305e', mid: '#564b87', bot: '#8a6fae', cloud: 0.13, star: 1,    pal: 'pastel', glow: 0.45 },
    { name: 'Fonds marins',      icon: 'fish',   top: '#62c2ea', mid: '#3795d2', bot: '#1d5fa6', cloud: 0,    star: 0,    pal: 'marine', glow: 0.4,  mode: 'water' },
    { name: 'Monde pixel',       icon: 'pixel',  top: '#8fd6ff', mid: '#c2ecff', bot: '#a8e8b8', cloud: 0.9,  star: 0,    pal: 'pastel', glow: 0,    mode: 'pixel' },
    { name: 'Néon rétro',        icon: 'neon',   top: '#160a2e', mid: '#341058', bot: '#0c0524', cloud: 0,    star: 0.7,  pal: 'neon',   glow: 1,    mode: 'neon' },
    { name: 'Cosmos',            icon: 'planet', top: '#0b0b28', mid: '#1c1242', bot: '#2c1856', cloud: 0,    star: 1,    pal: 'cosmos', glow: 0.8,  mode: 'space' },
  ].map(t => Object.assign({}, t, { top: hexToRgb(t.top), mid: hexToRgb(t.mid), bot: hexToRgb(t.bot) }));
  function curThemeIdx() { return (level - 1) % THEMES.length; }
  function curTheme() { return THEMES[curThemeIdx()]; }
  // chaque monde a ses propres couleurs de bulles
  const PAL_SETS = {
    pastel: { colors: PASTELS, names: ['roses', 'bleues', 'lilas', 'menthe', 'pêche', 'citron'] },
    marine: { colors: [
      { body: '#9fe8ff', cheek: '#5fc2e8' },
      { body: '#b5ead7', cheek: '#8fd6ba' },
      { body: '#cdd9ff', cheek: '#92a8e8' },
      { body: '#ffc9e2', cheek: '#ff8fc0' },
    ], names: ['azur', 'menthe', 'pervenche', 'corail'] },
    neon: { colors: [
      { body: '#ff5fd6', cheek: '#ff9ee8' },
      { body: '#45e8ff', cheek: '#9ff4ff' },
      { body: '#b07aff', cheek: '#d4b3ff' },
      { body: '#5fff9e', cheek: '#aaffd0' },
      { body: '#ffe45f', cheek: '#fff3ad' },
    ], names: ['magenta', 'cyan', 'violettes', 'vert fluo', 'jaune fluo'] },
    cosmos: { colors: [
      { body: '#a8b8ff', cheek: '#7e94e8' },
      { body: '#ffb3e8', cheek: '#f08fd0' },
      { body: '#9ff0e0', cheek: '#6ad4c0' },
      { body: '#e8d9ff', cheek: '#c0a8f0' },
    ], names: ['pervenche', 'roses', 'turquoise', 'lavande'] },
  };
  function currentPalSet() { return PAL_SETS[curTheme().pal] || PAL_SETS.pastel; }

  const sky = {
    top: THEMES[0].top.slice(), mid: THEMES[0].mid.slice(), bot: THEMES[0].bot.slice(),
    cloud: THEMES[0].cloud, star: THEMES[0].star,
  };
  const fxA = THEMES.map((t, i) => (i === 0 ? 1 : 0)); // intensité de chaque décor (fondu croisé)
  const fxParts = {};
  function parts(key, n, init) {
    let arr = fxParts[key];
    if (!arr) { arr = fxParts[key] = []; for (let i = 0; i < n; i++) arr.push(init(i)); }
    return arr;
  }
  function lerpTo(arr, target, k) {
    for (let i = 0; i < 3; i++) arr[i] += (target[i] - arr[i]) * k;
  }
  function rgb(a) { return 'rgb(' + (a[0] | 0) + ',' + (a[1] | 0) + ',' + (a[2] | 0) + ')'; }

  // ---------- Audio (sons et musique générés, aucun fichier) ----------
  let audioCtx = null;
  let master = null;   // compresseur doux : le mix reste rond même quand tout sonne
  let noiseBuf = null; // bruit blanc partagé (souffles, ambiances)
  function ensureAudio() {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        master = audioCtx.createDynamicsCompressor();
        master.threshold.value = -18;
        master.ratio.value = 6;
        master.connect(audioCtx.destination);
      } catch (e) {}
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    updateMusic();
  }
  function noiseBuffer() {
    if (!noiseBuf) {
      noiseBuf = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    return noiseBuf;
  }
  // souffle feutré (bruit filtré qui glisse d'une hauteur à l'autre)
  function whoosh(from, to, dur, vol) {
    if (!audioCtx || !soundOn) return;
    const t = audioCtx.currentTime;
    const s = audioCtx.createBufferSource();
    s.buffer = noiseBuffer(); s.loop = true;
    const f = audioCtx.createBiquadFilter();
    f.type = 'bandpass'; f.Q.value = 1.2;
    f.frequency.setValueAtTime(from, t);
    f.frequency.exponentialRampToValueAtTime(to, t + dur);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.3);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f).connect(g).connect(master);
    s.start(t); s.stop(t + dur + 0.05);
  }
  // saupoudrage cristallin (accompagne les confettis)
  function sprinkle() {
    if (!audioCtx || !soundOn) return;
    const t = audioCtx.currentTime;
    for (let i = 0; i < 7; i++) {
      const at = t + Math.random() * 0.5;
      const s = audioCtx.createBufferSource();
      s.buffer = noiseBuffer(); s.loop = true;
      const f = audioCtx.createBiquadFilter();
      f.type = 'highpass';
      f.frequency.value = 2500 + Math.random() * 2500;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.001, at);
      g.gain.exponentialRampToValueAtTime(0.012, at + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, at + 0.06);
      s.connect(f).connect(g).connect(master);
      s.start(at); s.stop(at + 0.1);
    }
  }
  // « blub » discret quand une bulle naît à l'écran
  function playBlub(r) {
    if (!audioCtx || !soundOn) return;
    const t = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    o.type = 'sine';
    const p = 150 + (52 - r) * 4;
    o.frequency.setValueAtTime(p, t);
    o.frequency.exponentialRampToValueAtTime(p * 1.6, t + 0.1);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.001, t);
    g.gain.exponentialRampToValueAtTime(0.02, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
    o.connect(g).connect(master);
    o.start(t); o.stop(t + 0.18);
  }
  function tone(freq, when, dur, vol, type, attack) {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.001, when);
    g.gain.exponentialRampToValueAtTime(vol, when + (attack || 0.015));
    g.gain.exponentialRampToValueAtTime(0.001, when + dur);
    o.connect(g).connect(master);
    o.start(when);
    o.stop(when + dur + 0.05);
  }
  function playPop(pitch) {
    if (!audioCtx || !soundOn) return;
    const t = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(pitch, t);
    o.frequency.exponentialRampToValueAtTime(pitch * 1.8, t + 0.08);
    g.gain.setValueAtTime(0.001, t);
    g.gain.exponentialRampToValueAtTime(0.15, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    o.connect(g).connect(master);
    o.start(t);
    o.stop(t + 0.25);
    if (pitch < 520) { // les grosses bulles ont un « blop » plus rond
      const o2 = audioCtx.createOscillator();
      const g2 = audioCtx.createGain();
      o2.type = 'sine';
      o2.frequency.value = pitch * 0.5;
      g2.gain.setValueAtTime(0.001, t);
      g2.gain.exponentialRampToValueAtTime(0.06, t + 0.015);
      g2.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
      o2.connect(g2).connect(master);
      o2.start(t);
      o2.stop(t + 0.2);
    }
  }
  function playPuff() { // souffle discret quand on tape dans le vide
    if (!audioCtx || !soundOn) return;
    tone(170, audioCtx.currentTime, 0.1, 0.022, 'sine', 0.02);
  }
  function playChime(notes, vol) {
    if (!audioCtx || !soundOn) return;
    const t = audioCtx.currentTime;
    notes.forEach((f, i) => tone(f, t + i * 0.08, 0.32, vol || 0.09, 'triangle'));
  }
  function buzz(p) {
    if (!vibesOn) return;
    if (navigator.vibrate) { try { navigator.vibrate(p); } catch (e) {} }
  }

  // Musique générative : chaque ciel a sa propre ambiance (gamme, tempo, timbre).
  const MOODS = [
    { // aube rosée : berceuse pentatonique douce, brise légère
      scale: [261.63, 293.66, 329.63, 392.0, 440.0, 523.25, 587.33, 659.25],
      step: 1100, wave: 'triangle', vol: 0.035, pad: 130.81, padEvery: 6, dual: 0.35,
      airFreq: 320, airVol: 0.012 },
    { // plein ciel : plus lumineux, brise claire et oiseaux au loin
      scale: [293.66, 329.63, 369.99, 440.0, 493.88, 587.33, 659.25, 739.99],
      step: 820, wave: 'triangle', vol: 0.04, pad: 146.83, padEvery: 5, dual: 0.45,
      airFreq: 500, airVol: 0.014, bird: true },
    { // coucher de soleil : plus chaud, plus grave, vent feutré
      scale: [220.0, 246.94, 261.63, 329.63, 392.0, 440.0, 523.25],
      step: 1350, wave: 'sine', vol: 0.042, pad: 110.0, padEvery: 5, dual: 0.3,
      airFreq: 260, airVol: 0.016 },
    { // nuit étoilée : boîte à musique clairsemée, souffle profond, grillons
      scale: [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5],
      step: 1650, wave: 'triangle', vol: 0.028, pad: 98.0, padEvery: 4, dual: 0.2,
      airFreq: 170, airVol: 0.011, cricket: true },
    { // fonds marins : notes liquides, lentes et graves, glouglous
      scale: [196.0, 220.0, 261.63, 293.66, 329.63, 392.0],
      step: 1500, wave: 'sine', vol: 0.04, pad: 98.0, padEvery: 4, dual: 0.25,
      airFreq: 130, airVol: 0.02, water: true },
    { // monde pixel : petite mélodie chiptune toute douce
      scale: [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5],
      step: 620, wave: 'square', vol: 0.012, pad: 130.81, padEvery: 8, dual: 0.5, dur: 0.22,
      airFreq: 60, airVol: 0.0001 },
    { // néon rétro : pulsation synthwave feutrée
      scale: [233.08, 277.18, 311.13, 369.99, 415.3, 466.16],
      step: 950, wave: 'sawtooth', vol: 0.014, pad: 58.27, padEvery: 2, dual: 0.3, dur: 0.5,
      airFreq: 220, airVol: 0.008 },
    { // cosmos : scintillements rares sur nappe très profonde
      scale: [783.99, 880.0, 1046.5, 1318.5],
      step: 2300, wave: 'sine', vol: 0.026, pad: 65.41, padEvery: 3, dual: 0.15, dur: 3,
      airFreq: 90, airVol: 0.015 },
  ];
  // nappe d'air continue (bruit très filtré), suit le thème en douceur
  let ambient = null;
  function startAmbient() {
    if (ambient || !audioCtx) return;
    const s = audioCtx.createBufferSource();
    s.buffer = noiseBuffer(); s.loop = true;
    const f = audioCtx.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 300; f.Q.value = 0.6;
    const g = audioCtx.createGain();
    g.gain.value = 0.0001;
    s.connect(f).connect(g).connect(master);
    s.start();
    ambient = { src: s, filter: f, gain: g };
  }
  function stopAmbient() {
    if (!ambient) return;
    try { ambient.src.stop(); } catch (e) {}
    ambient = null;
  }
  // gazouillis bref et lointain (plein ciel)
  function chirp(at) {
    for (let i = 0; i < 2; i++) {
      const off = at + i * 0.17;
      const o = audioCtx.createOscillator();
      o.type = 'sine';
      o.frequency.setValueAtTime(2000 + i * 350 + Math.random() * 200, off);
      o.frequency.exponentialRampToValueAtTime(2800 + i * 350, off + 0.1);
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.001, off);
      g.gain.exponentialRampToValueAtTime(0.01, off + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, off + 0.12);
      o.connect(g).connect(master);
      o.start(off); o.stop(off + 0.16);
    }
  }
  // glouglou liquide (fonds marins)
  function bloop(at) {
    const o = audioCtx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(200 + Math.random() * 120, at);
    o.frequency.exponentialRampToValueAtTime(480 + Math.random() * 200, at + 0.18);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.001, at);
    g.gain.exponentialRampToValueAtTime(0.012, at + 0.03);
    g.gain.exponentialRampToValueAtTime(0.001, at + 0.22);
    o.connect(g).connect(master);
    o.start(at); o.stop(at + 0.26);
  }
  // grillon très discret (nuit)
  function cricket(at) {
    for (let i = 0; i < 3; i++) {
      tone(4200 + Math.random() * 200, at + i * 0.07, 0.05, 0.006, 'triangle', 0.01);
    }
  }
  let musicTimer = null;
  let musicBeat = 0;
  function musicTick() {
    const mood = MOODS[(level - 1) % MOODS.length];
    if (audioCtx && musicOn && !document.hidden) {
      const t = audioCtx.currentTime;
      musicBeat++;
      if (Math.random() < 0.78) {
        const dur = mood.dur || 1.4;
        const n = mood.scale[(Math.random() * mood.scale.length) | 0];
        tone(n, t, dur, mood.vol, mood.wave, 0.05);
        if (Math.random() < mood.dual) {
          tone(mood.scale[(Math.random() * mood.scale.length) | 0], t + 0.45, dur * 0.85, mood.vol * 0.8, mood.wave, 0.05);
        }
      }
      if (musicBeat % mood.padEvery === 0) {
        tone(mood.pad, t, 3.4, 0.022, 'sine', 0.4); // nappe grave très discrète
      }
      if (ambient) { // la brise suit le ciel
        ambient.gain.gain.setTargetAtTime(mood.airVol, t, 1.2);
        ambient.filter.frequency.setTargetAtTime(mood.airFreq, t, 1.5);
      }
      if (mood.bird && Math.random() < 0.16) chirp(t + Math.random() * 0.6);
      if (mood.cricket && Math.random() < 0.22) cricket(t + Math.random() * 0.8);
      if (mood.water && Math.random() < 0.3) bloop(t + Math.random() * 0.8);
    } else if (ambient && audioCtx) {
      ambient.gain.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 0.5);
    }
    // la musique s'anime un peu pendant la fièvre
    const step = mood.step * (performance.now() < feverUntil ? 0.55 : 1);
    musicTimer = setTimeout(musicTick, step * (0.85 + Math.random() * 0.3));
  }
  function updateMusic() {
    if (musicOn && audioCtx && !musicTimer) {
      startAmbient();
      musicTick();
    } else if ((!musicOn || !audioCtx) && musicTimer) {
      clearTimeout(musicTimer);
      musicTimer = null;
      stopAmbient();
    }
  }

  // ---------- Menu d'options ----------
  function syncOpts() {
    optSound.classList.toggle('on', soundOn);
    optMusic.classList.toggle('on', musicOn);
    optVibes.classList.toggle('on', vibesOn);
  }
  syncOpts();
  if (!navigator.vibrate) optVibesRow.style.display = 'none'; // non supporté (ex. iPhone)
  menuBtn.addEventListener('click', () => {
    ensureAudio();
    syncOpts();
    settingsEl.classList.add('open');
    whoosh(300, 900, 0.2, 0.016);
  });
  closeSettingsBtn.addEventListener('click', () => {
    settingsEl.classList.remove('open');
    whoosh(900, 300, 0.16, 0.013);
  });
  settingsEl.addEventListener('click', (e) => {
    if (e && e.target === settingsEl) {
      settingsEl.classList.remove('open');
      whoosh(900, 300, 0.16, 0.013);
    }
  });
  optSound.addEventListener('click', () => {
    soundOn = !soundOn;
    store.set('bullepop-sound', soundOn ? '1' : '0');
    syncOpts();
    if (soundOn) { ensureAudio(); playChime([660, 880], 0.07); }
  });
  optMusic.addEventListener('click', () => {
    musicOn = !musicOn;
    store.set('bullepop-music', musicOn ? '1' : '0');
    syncOpts();
    ensureAudio();
    playChime(musicOn ? [740] : [520], 0.04);
  });
  optVibes.addEventListener('click', () => {
    vibesOn = !vibesOn;
    store.set('bullepop-vibes', vibesOn ? '1' : '0');
    syncOpts();
    playChime(vibesOn ? [740] : [520], 0.04);
    if (vibesOn) buzz(15); // petit retour pour confirmer
  });
  openAlbumBtn.addEventListener('click', () => {
    settingsEl.classList.remove('open');
    renderAlbum();
    albumEl.classList.add('open');
    whoosh(350, 1000, 0.2, 0.016);
  });

  // ---------- Bulles ----------
  // mode : 'rise' (monte depuis le bas), 'place' (apparaît sur place), 'fall' (pluie de bulles)
  function spawnBubble(mode) {
    let kind = 'normal';
    const roll = Math.random();
    if (roll < 0.05) kind = 'golden';
    else if (roll < 0.08) kind = 'rainbow';
    else if (roll < 0.10 && performance.now() > frenzyUntil) kind = 'heart';

    const special = kind !== 'normal';
    const r = special ? 27 + Math.random() * 8 : 26 + Math.random() * 24;
    const set = currentPalSet();
    const pi = (Math.random() * set.colors.length) | 0;
    const palette = kind === 'golden' ? GOLD : kind === 'heart' ? HEART : kind === 'rainbow' ? RAINBOW
      : set.colors[pi];

    const b = {
      id: ++idSeq,
      x: r + Math.random() * Math.max(1, W - r * 2),
      y: 0,
      r, baseR: r,
      vy: 0,
      wobblePhase: Math.random() * Math.PI * 2,
      wobbleSpeed: 0.015 + Math.random() * 0.02,
      wobbleAmp: 0.5 + Math.random() * 0.8,
      palette, kind, pi,
      bow: kind === 'normal' && Math.random() < 0.18, // petit nœud décoratif
      blink: 0,
      nextBlink: 120 + Math.random() * 240,
      birth: performance.now(),
    };
    if (mode === 'fall') {
      b.y = -r - 10;
      b.vy = 0.6 + Math.random() * 0.4;
    } else if (mode === 'place') {
      b.y = H * 0.14 + Math.random() * H * 0.62;
      b.vy = -(0.25 + Math.random() * 0.3);
    } else {
      b.y = H + r + 10;
      b.vy = -(0.5 + Math.random() * 0.5) * (kind === 'golden' ? 1.4 : 1);
    }
    bubbles.push(b);
    if (mode === 'place') {
      const nowB = performance.now();
      if (Math.random() < 0.6 && nowB - (spawnBubble._blub || 0) > 200) {
        spawnBubble._blub = nowB;
        playBlub(r);
      }
    }
    return b;
  }

  function spawnParticles(x, y, color, fancy) {
    if (particles.length > 320) return;
    const n = fancy ? 16 : 9;
    for (let i = 0; i < n; i++) {
      const a = (Math.PI * 2 * i) / n + Math.random() * 0.5;
      const sp = 1.5 + Math.random() * 3.5;
      particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 1,
        r: 2 + Math.random() * 4,
        life: 1,
        decay: 0.015 + Math.random() * 0.02,
        color: fancy && Math.random() < 0.5 ? '#fff3c4' : color,
        star: fancy || Math.random() < 0.25,
        rot: Math.random() * Math.PI * 2,
        vrot: (Math.random() - 0.5) * 0.2,
      });
    }
  }

  function sparkle(x, y, color, count, soft) {
    if (particles.length > 360) return;
    for (let i = 0; i < count; i++) {
      particles.push({
        x: x + (Math.random() - 0.5) * 14,
        y: y + (Math.random() - 0.5) * 14,
        vx: (Math.random() - 0.5) * 1.5,
        vy: -0.5 - Math.random(),
        r: 1.5 + Math.random() * 2,
        life: soft ? 0.5 : 0.7,
        decay: 0.04,
        color: color || '#ffffff',
        star: true,
        rot: Math.random() * Math.PI,
        vrot: 0.1,
      });
    }
  }

  function confettiRain() {
    sprinkle();
    const colors = ['#ffb3c6', '#a8d8ea', '#c3aed6', '#b5ead7', '#ffdac1', '#ffd96a'];
    for (let i = 0; i < 32; i++) {
      particles.push({
        x: Math.random() * W,
        y: -10 - Math.random() * 40,
        vx: (Math.random() - 0.5) * 1.2,
        vy: 1 + Math.random() * 2.2,
        r: 3 + Math.random() * 3.5,
        life: 1,
        decay: 0.004 + Math.random() * 0.005,
        color: colors[(Math.random() * colors.length) | 0],
        star: true,
        rot: Math.random() * Math.PI * 2,
        vrot: (Math.random() - 0.5) * 0.25,
      });
    }
  }

  function addPopup(x, y, text, color, big) {
    popups.push({ x: Math.min(Math.max(x, 40), W - 40), y, text, life: 1, color, big });
  }

  function showToast(text, ms, icon) {
    toastEl.innerHTML = (icon ? ic(icon, 26) : '') + '<span>' + text + '</span>';
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toastEl.classList.remove('show'), ms || 1500);
  }

  // ---------- Petits défis doux (jamais de chrono, jamais d'échec) ----------
  function newQuest() {
    const r = Math.random();
    if (r < 0.4) {
      const set = currentPalSet();
      const ci = (Math.random() * set.colors.length) | 0;
      quest = { t: 'color', ci, need: 6, got: 0, label: 'Bulles ' + set.names[ci] };
    } else if (r < 0.6) {
      quest = { t: 'small', need: 5, got: 0, label: 'Petites bulles' };
    } else if (r < 0.8) {
      quest = { t: 'big', need: 4, got: 0, label: 'Grosses bulles' };
    } else if (r < 0.95) {
      quest = { t: 'any', need: 12, got: 0, label: 'Bulles éclatées' };
    } else {
      quest = { t: 'gold', need: 1, got: 0, label: 'Bulle dorée' };
    }
    renderQuest();
    questEl.classList.add('show');
  }
  function renderQuest() {
    questEl.innerHTML = ic('target', 15) + '<span>' + quest.label + ' : ' + quest.got + '/' + quest.need + '</span>';
  }
  function completeQuest() {
    score += 150;
    questsDone++;
    store.set('bullepop-quests', questsDone);
    if (questsDone >= 5) unlock('quest5');
    showToast('Défi réussi ! +150', 1800, 'target');
    confettiRain();
    playChime([659, 784, 988], 0.09);
    buzz([10, 30, 10]);
    onScoreChanged();
    quest = null;
    questCooldown = 480; // petite pause avant le défi suivant
    questEl.classList.remove('show');
  }

  // ---------- Bonus actifs ----------
  function bonusMult(now) {
    if (now < feverUntil) return 3;
    if (now < frenzyUntil) return 2;
    return 1;
  }

  // ---------- Pop ! ----------
  // noCombo : les pops automatiques (chaîne, glisser) profitent du combo mais ne le font pas monter
  function popBubble(b, chainIndex, noCombo) {
    const idx = bubbles.indexOf(b);
    if (idx === -1) return;
    bubbles.splice(idx, 1);

    const now = performance.now();
    if (!noCombo) {
      combo = (now - lastPopTime < 2500) ? combo + 1 : 1;
      lastPopTime = now;
      if (combo > maxCombo) { maxCombo = combo; store.set('bullepop-maxcombo', maxCombo); }
    }
    const mult = Math.min(1 + Math.floor(combo / 4), 5); // x1 à x5
    if (!noCombo) {
      if (combo === 1) popBubble._mult = 1;
      if (mult > (popBubble._mult || 1)) { // petit arpège à chaque palier
        popBubble._mult = mult;
        playChime([587 + mult * 60, 880 + mult * 60], 0.05);
      }
    }
    if (mult >= 5) unlock('combo5');

    // fièvre des bulles : récompense des longs enchaînements précis, points x3
    if (!noCombo && combo >= 12 && now > feverUntil) {
      feverUntil = now + 6000;
      showToast('Fièvre des bulles ! Points x3', 1800, 'flame');
      playChime([659, 784, 988, 1318], 0.1);
      buzz([12, 40, 12]);
      unlock('fever');
    }
    const bonus = bonusMult(now);

    const base = b.kind === 'golden' ? 50
      : b.kind === 'heart' ? 20
      : b.kind === 'rainbow' ? 15
      : Math.max(1, Math.round((52 - b.baseR) / 7) + 1);
    const points = base * mult * bonus;
    score += points;
    totalPops++;
    scoreCard.classList.add('bump');
    clearTimeout(popBubble._bumpT);
    popBubble._bumpT = setTimeout(() => scoreCard.classList.remove('bump'), 170);

    if (quest) {
      const m = quest.t === 'any'
        || (quest.t === 'color' && b.kind === 'normal' && b.pi === quest.ci)
        || (quest.t === 'small' && b.kind === 'normal' && b.baseR < 38)
        || (quest.t === 'big' && b.baseR > 40)
        || (quest.t === 'gold' && b.kind === 'golden');
      if (m) {
        quest.got++;
        if (quest.got >= quest.need) completeQuest();
        else renderQuest();
      }
    }

    const fancy = b.kind !== 'normal';
    spawnParticles(b.x, b.y, b.kind === 'golden' ? '#ffd96a' : b.palette.body, fancy);
    rings.push({ x: b.x, y: b.y, r: b.baseR * 0.6, max: b.baseR * 2.4, life: 1, color: b.palette.cheek });
    addPopup(b.x, b.y - b.r, '+' + points, fancy ? '#ff9f1c' : b.palette.cheek, fancy);

    if (chainIndex !== undefined) {
      playPop(Math.min(1400, 380 + chainIndex * 55));
    } else {
      playPop((280 + (52 - b.baseR) * 11 + Math.random() * 50) * (1 + Math.min(combo, 12) * 0.012));
    }

    if (b.kind === 'golden') {
      playChime([880, 1174, 1568], 0.1);
      buzz([12, 40, 12]);
      unlock('gold');
    } else if (b.kind === 'rainbow') {
      // réaction en chaîne : toutes les bulles éclatent l'une après l'autre
      const others = bubbles.slice().sort((p, q) =>
        Math.hypot(p.x - b.x, p.y - b.y) - Math.hypot(q.x - b.x, q.y - b.y));
      others.forEach((ob, i) => chainQueue.push({ id: ob.id, at: now + 80 * (i + 1), index: i }));
      if (others.length > 2) showToast('Réaction en chaîne !', 1400, 'rainbow');
      buzz([12, 40, 12]);
      unlock('rainbow');
    } else if (b.kind === 'heart') {
      frenzyUntil = now + 6500;
      showToast('Pluie de bulles ! Points x2', 1800, 'heart');
      playChime([523, 659, 784], 0.1);
      buzz([12, 40, 12]);
      unlock('heart');
    } else {
      buzz(8);
    }

    if (combo >= 3) {
      comboEl.innerHTML = 'Combo x' + mult +
        (bonus === 3 ? ' ' + ic('flame', 24) + 'x3' : bonus === 2 ? ' ' + ic('heart', 24) + 'x2' : ' ' + ic('sparkle', 24));

      comboEl._t = setTimeout(() => comboEl.classList.remove('show'), 900);

    store.set('bullepop-pops', totalPops);

      firstPop = true;

  // l'interface change de peau dans les mondes pixel et néon

    document.body.className = m === 'pixel' ? 'pixelMode' : m === 'neon' ? 'neonMode' : '';

  // record battu et passages de niveau (appelé après chaque gain de points)
  function onScoreChanged() {
    if (score > best) {
      best = score;
      store.set('bullepop-best', best);
      bestEl.textContent = best;
      if (!recordBeaten && totalPops > 20) {
        recordBeaten = true;
        showToast('Nouveau record !', 1800, 'trophy');
        playChime([659, 784, 1046], 0.1);
      }
    }
    if (best >= 5000) unlock('score5k');

    // niveaux : paliers progressifs, le ciel change tranquillement, pure récompense
    let newLevel = level;
    while (score >= cumulAt(newLevel)) newLevel++;
    if (newLevel > level) {
      level = newLevel;
      levelEl.textContent = 'Niveau ' + level;
      applyThemeClass();
      if (level > maxLevel) { maxLevel = level; store.set('bullepop-maxlevel', maxLevel); }
      const theme = THEMES[(level - 1) % THEMES.length];
      showToast('Niveau ' + level + ' · ' + theme.name, 2000, theme.icon);
      whoosh(250, 1600, 0.5, 0.02);
      confettiRain();
      playChime([523, 659, 784, 1046], 0.1);
      buzz([10, 30, 10, 30, 10]);

  function catchStar(s, idx) {
    shootingStars.splice(idx, 1);
    const now = performance.now();
    const mult = Math.min(1 + Math.floor(Math.max(combo - 1, 0) / 2), 5);
    const points = 100 * mult * bonusMult(now);
    score += points;
    starsCaught++;
    store.set('bullepop-stars', starsCaught);
    addPopup(s.x, s.y - 20, '+' + points, '#ffd96a', true);
    showToast('Vœu exaucé !', 1600, 'shootstar');
    spawnParticles(s.x, s.y, '#ffd96a', true);
    rings.push({ x: s.x, y: s.y, r: 14, max: 90, life: 1, color: '#ffd96a' });
    playChime([1046, 1318, 1568, 2093], 0.09);
    buzz([10, 30, 10]);
    unlock('star');
    onScoreChanged();
    nextStarAt = now + 18000 + Math.random() * 22000;
  }

  function popAt(px, py) {
    // étoile filante en premier (grosse zone, c'est un cadeau)
    for (let i = shootingStars.length - 1; i >= 0; i--) {
      const s = shootingStars[i];
      if (Math.hypot(s.x - px, s.y - py) < 44) { catchStar(s, i); return; }
    }
    // viser compte : il faut toucher la bulle (petite marge de confort)
    let hit = null, hitDist = Infinity;
    for (const b of bubbles) {
      const d = Math.hypot(b.x - px, b.y - py);
      if (d < b.r + 6 && d < hitDist) { hit = b; hitDist = d; }
    }
    if (hit) {
      popBubble(hit);
    } else {
      // tap dans le vide : le combo retombe, c'est la seule conséquence
      combo = 0;
      playPuff();
      sparkle(px, py, '#ffffff', 3);
    }
  }

  // glisser le doigt : tout éclate au passage
  let lastTrailX = -999, lastTrailY = -999;
  function swipeAt(px, py) {
    for (let i = shootingStars.length - 1; i >= 0; i--) {
      const s = shootingStars[i];
      if (Math.hypot(s.x - px, s.y - py) < 44) { catchStar(s, i); return; }
    }
    const nowS = performance.now();
    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      if (Math.hypot(b.x - px, b.y - py) < b.r * 0.95) {
        if (nowS - (swipeAt._last || 0) < 110) break; // cadence douce, pas de moisson frénétique
        swipeAt._last = nowS;
        popBubble(b, undefined, true);
        break;
      }
    }
    if (Math.hypot(px - lastTrailX, py - lastTrailY) > 16) {
      lastTrailX = px; lastTrailY = py;
      sparkle(px, py, '#fff0f7', 2, true);
      if (nowS - (swipeAt._w || 0) > 160) {
        swipeAt._w = nowS;
        whoosh(500, 900, 0.1, 0.008);
      }
    }
  }

  // ---------- Entrées (souris + multi-touch + glisser) ----------
  let ptrX = null, ptrY = null; // dernière position connue : les bulles la regardent
  function onPress(e) {
    e.preventDefault();
    ensureAudio();
    ptrX = e.clientX; ptrY = e.clientY;
    popAt(e.clientX, e.clientY);
  }
  function onMove(e) {
    ptrX = e.clientX; ptrY = e.clientY;
    // doigt posé ou bouton de souris enfoncé
    if (e.pointerType === 'touch' || e.buttons) {
      e.preventDefault();
      swipeAt(e.clientX, e.clientY);
    }
  }
  if (window.PointerEvent) {
    canvas.addEventListener('pointerdown', onPress);
    canvas.addEventListener('pointermove', onMove);
  } else {
    canvas.addEventListener('mousedown', onPress);
    canvas.addEventListener('mousemove', (e) => { if (e.buttons) swipeAt(e.clientX, e.clientY); });
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      ensureAudio();
      for (const t of e.changedTouches) popAt(t.clientX, t.clientY);
    }, { passive: false });
    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      for (const t of e.changedTouches) swipeAt(t.clientX, t.clientY);
    }, { passive: false });
  }
  document.addEventListener('touchmove', (e) => {
    if (!(e.target && e.target.closest && e.target.closest('#album, #settings'))) e.preventDefault();
  }, { passive: false });
  document.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('visibilitychange', () => { lastTime = performance.now(); });

  // ---------- Dessin ----------
  // ---------- Décors par thème ----------
  function fxDawn(a, time, dt) { // soleil levant + pétales
    const g = ctx.createRadialGradient(W * 0.5, H * 1.05, 10, W * 0.5, H * 1.05, H * 0.6);
    g.addColorStop(0, 'rgba(255,210,160,' + (0.55 * a).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(255,210,160,0)');

    for (const p of parts('petale', 10, () => ({
      x: Math.random() * W, y: Math.random() * H,

      rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.04,
      s: 4 + Math.random() * 5,

      if (p.y > H + 10 || p.x > W + 10) { p.x = Math.random() * W * 0.6 - 20; p.y = -10; }
      ctx.save();

  function fxSunset(a, time, dt) { // soleil couchant + oiseaux au loin

  function fxNight(a, time, dt) { // lune + lucioles

      lg.addColorStop(1, 'rgba(255,240,140,0)');

      ctx.beginPath(); ctx.arc(lu.x, lu.y, 7, 0, Math.PI * 2); ctx.fill();

  function fxWater(a, time, dt) { // rayons de lumière, bulles d'eau, poissons, algues
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

      const bx = W * (0.2 + i * 0.3) + Math.sin(time * 0.0004 + i * 2) * 30;

      lg.addColorStop(0, 'rgba(255,255,255,' + (0.10 * a).toFixed(3) + ')');
      lg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = lg;
      ctx.fillRect(-30 - i * 8, 0, 60 + i * 16, H * 1.2);
      ctx.restore();
    }
    ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,' + (0.3 * a).toFixed(3) + ')';
    for (const e of parts('eau', 14, () => ({
      x: Math.random() * W, y: Math.random() * H,
      vy: -(0.3 + Math.random() * 0.4), ph: Math.random() * 6, s: 1 + Math.random() * 2.2,
    }))) {

      if (e.y < -5) { e.y = H + 5; e.x = Math.random() * W; }
      ctx.beginPath(); ctx.arc(e.x, e.y, e.s, 0, Math.PI * 2); ctx.fill();
    }
    for (const f of parts('poissons', 3, () => ({
      x: Math.random() * W, y: H * (0.3 + Math.random() * 0.5),
      dir: Math.random() < 0.5 ? -1 : 1, sp: 0.4 + Math.random() * 0.5,
      s: 8 + Math.random() * 7, ph: Math.random() * 6,
    }))) {
      f.x += f.dir * f.sp * dt;
      f.y += Math.sin(time * 0.001 + f.ph) * 0.2 * dt;
      if (f.dir > 0 && f.x > W + 30) { f.x = -30; f.y = H * (0.3 + Math.random() * 0.5); }
      if (f.dir < 0 && f.x < -30) { f.x = W + 30; f.y = H * (0.3 + Math.random() * 0.5); }
      ctx.save();
      ctx.translate(f.x, f.y);

      ctx.fillStyle = 'rgba(18,60,105,' + (0.35 * a).toFixed(3) + ')';

  function fxPixel(a, time, dt) { // soleil franc + collines (la pixellisation fait le reste)

    ctx.fillStyle = 'rgba(126,200,138,' + (0.85 * a).toFixed(3) + ')';

  function fxNeon(a, time, dt) { // soleil rayé + grille 3D qui défile vers l'horizon

    ctx.fillStyle = 'rgba(22,10,46,' + a.toFixed(3) + ')';

  function fxSpace(a, time, dt) { // nébuleuses + planète à anneaux

  const FX = [fxDawn, fxDay, fxSunset, fxNight, fxWater, fxPixel, fxNeon, fxSpace];

  function drawBackground(time, dt) {
    const ti = curThemeIdx();
    const target = THEMES[ti];
    const k = Math.min(1, 0.02 * dt);
    lerpTo(sky.top, target.top, k);
    lerpTo(sky.mid, target.mid, k);
    lerpTo(sky.bot, target.bot, k);
    sky.cloud += (target.cloud - sky.cloud) * k;
    sky.star += (target.star - sky.star) * k;
    for (let i = 0; i < fxA.length; i++) fxA[i] += ((i === ti ? 1 : 0) - fxA[i]) * Math.min(1, k * 1.4);

    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, rgb(sky.top));
    g.addColorStop(0.55, rgb(sky.mid));
    g.addColorStop(1, rgb(sky.bot));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    if (sky.star > 0.02) {
      ctx.fillStyle = '#fff';
      for (const s of stars) {
        const tw = 0.45 + 0.55 * Math.sin(time * 0.002 + s.ph);
        ctx.globalAlpha = sky.star * tw * 0.9;
        ctx.beginPath();
        ctx.arc(s.fx * W, s.fy * H, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    for (let i = 0; i < THEMES.length; i++) {
      if (fxA[i] > 0.02) FX[i](fxA[i], time, dt);
    }

    if (sky.cloud > 0.02) {
      ctx.fillStyle = 'rgba(255, 255, 255, ' + sky.cloud.toFixed(3) + ')';
      for (const cl of clouds) {
        cl.drift += cl.speed * dt;
        const x = ((cl.fx * W + cl.drift) % (W + cl.r * 4)) - cl.r * 2;
        const y = cl.fy * H;
        ctx.beginPath();
        ctx.arc(x, y, cl.r * 0.6, 0, Math.PI * 2);
        ctx.arc(x + cl.r * 0.5, y - cl.r * 0.25, cl.r * 0.45, 0, Math.PI * 2);
        ctx.arc(x + cl.r, y, cl.r * 0.55, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    const now = performance.now();
    if (now < frenzyUntil) {
      ctx.fillStyle = 'rgba(255, 150, 190, 0.07)';
      ctx.fillRect(0, 0, W, H);
    }
    if (now < feverUntil) {
      const hue = (time * 0.06) % 360;
      const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
      vg.addColorStop(0, 'hsla(' + hue + ', 90%, 70%, 0)');
      vg.addColorStop(1, 'hsla(' + hue + ', 90%, 70%, 0.22)');
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, W, H);
    }
  }

  function heartPath(s) {
    ctx.beginPath();
    ctx.moveTo(0, s * 0.45);
    ctx.bezierCurveTo(-s * 0.7, 0, -s * 0.55, -s * 0.5, 0, -s * 0.15);
    ctx.bezierCurveTo(s * 0.55, -s * 0.5, s * 0.7, 0, 0, s * 0.45);
    ctx.closePath();
  }

  function drawBubble(b, time) {
    const age = (time - b.birth) / 1000;
    const popIn = Math.min(1, age * 4);
    const ease = 1 - Math.pow(1 - popIn, 3);
    const wob = Math.sin(time * 0.003 + b.wobblePhase) * 0.06;
    const rx = b.r * ease * (1 + wob);
    const ry = b.r * ease * (1 - wob);
    if (rx < 1 || ry < 1) return;

    ctx.save();
    ctx.translate(b.x, b.y);

    const th = curTheme();
    if (b.kind === 'golden') {
      ctx.shadowColor = 'rgba(255, 200, 60, 0.8)';
      ctx.shadowBlur = 22;
    } else if (b.kind === 'heart') {
      ctx.shadowColor = 'rgba(255, 110, 160, 0.7)';
      ctx.shadowBlur = 18;
    } else if (th.glow) {
      // dans les mondes lumineux, les bulles rayonnent de leur propre couleur
      ctx.shadowColor = b.palette.body;
      ctx.shadowBlur = 24 * th.glow;
    }

    // corps avec volume : lumière en haut à gauche, ombre sur le bord opposé
    ctx.beginPath();
    ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
    if (b.kind === 'rainbow') {
      const rg = ctx.createLinearGradient(-rx, -ry, rx, ry);
      rg.addColorStop(0, '#ffb3c6');
      rg.addColorStop(0.3, '#ffdac1');
      rg.addColorStop(0.55, '#b5ead7');
      rg.addColorStop(0.8, '#a8d8ea');
      rg.addColorStop(1, '#c3aed6');
      ctx.fillStyle = rg;
    } else {
      const p = b.palette;
      if (!p._hi) { p._hi = shade(p.body, 0.45); p._lo = shade(p.body, -0.18); }
      const bg = ctx.createRadialGradient(-rx * 0.35, -ry * 0.45, rx * 0.1, 0, 0, rx * 1.25);
      bg.addColorStop(0, p._hi);
      bg.addColorStop(0.55, p.body);
      bg.addColorStop(1, p._lo);
      ctx.fillStyle = bg;
    }
    ctx.fill();
    ctx.shadowBlur = 0;

    // double reflet : grand reflet doux + petit éclat net
    ctx.beginPath();
    ctx.ellipse(-rx * 0.35, -ry * 0.4, rx * 0.22, ry * 0.14, -0.6, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(rx * 0.18, -ry * 0.58, Math.max(1.2, rx * 0.07), 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
    ctx.fill();

    // visage kawaii
    const eyeY = -ry * 0.05;
    const eyeX = rx * 0.32;
    ctx.fillStyle = '#5a4a52';
    b.nextBlink--;
    if (b.nextBlink <= 0) { b.blink = 8; b.nextBlink = 150 + Math.random() * 250; }
    if (b.blink > 0) b.blink--;
    if (b.blink > 0) {
      ctx.lineWidth = Math.max(1.5, rx * 0.06);
      ctx.strokeStyle = '#5a4a52';
      ctx.lineCap = 'round';
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(s * eyeX - rx * 0.1, eyeY);
        ctx.lineTo(s * eyeX + rx * 0.1, eyeY);
        ctx.stroke();
      }
    } else {
      // les yeux suivent doucement le doigt ou le curseur
      let lx = 0, ly = 0;
      if (ptrX !== null) {
        const ddx = ptrX - b.x, ddy = ptrY - b.y;
        const dd = Math.hypot(ddx, ddy) || 1;
        lx = (ddx / dd) * rx * 0.08;
        ly = (ddy / dd) * ry * 0.08;
      }
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.arc(s * eyeX + lx, eyeY + ly, Math.max(2, rx * 0.09), 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // sourire
    ctx.beginPath();
    ctx.arc(0, ry * 0.18, rx * 0.16, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.lineWidth = Math.max(1.5, rx * 0.05);
    ctx.strokeStyle = '#5a4a52';
    ctx.lineCap = 'round';
    ctx.stroke();

    // joues roses
    ctx.fillStyle = b.palette.cheek;
    ctx.globalAlpha = 0.55;
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.ellipse(s * rx * 0.55, ry * 0.18, rx * 0.13, ry * 0.09, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // accessoires
    if (b.kind === 'golden') {
      ctx.fillStyle = '#ffb830';
      ctx.beginPath();
      const cw = rx * 0.5, ch = ry * 0.32, cy = -ry - ch * 0.2;
      ctx.moveTo(-cw, cy);
      ctx.lineTo(-cw, cy - ch);
      ctx.lineTo(-cw * 0.5, cy - ch * 0.45);
      ctx.lineTo(0, cy - ch * 1.15);
      ctx.lineTo(cw * 0.5, cy - ch * 0.45);
      ctx.lineTo(cw, cy - ch);
      ctx.lineTo(cw, cy);
      ctx.closePath();
      ctx.fill();
    } else if (b.kind === 'heart') {
      ctx.save();
      ctx.translate(rx * 0.55, -ry * 0.95);
      ctx.rotate(0.3);
      ctx.fillStyle = '#ff6f9c';
      heartPath(rx * 0.32);
      ctx.fill();
      ctx.restore();
    } else if (b.kind === 'rainbow') {
      for (let i = 0; i < 3; i++) {
        const a = time * 0.003 + (i * Math.PI * 2) / 3;
        const sx = Math.cos(a) * rx * 1.25;
        const sy = Math.sin(a) * ry * 1.25;
        ctx.globalAlpha = 0.7 + 0.3 * Math.sin(time * 0.01 + i);
        drawStarShape(sx, sy, 3.5, a, '#fff');
        ctx.globalAlpha = 1;
      }
    } else if (b.bow) {
      // petit nœud sur le côté
      ctx.save();
      ctx.translate(-rx * 0.62, -ry * 0.72);
      ctx.rotate(-0.5);
      ctx.fillStyle = b.palette.cheek;
      const bs = rx * 0.22;
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(-bs, -bs * 0.7); ctx.lineTo(-bs, bs * 0.7); ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(bs, -bs * 0.7); ctx.lineTo(bs, bs * 0.7); ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.arc(0, 0, bs * 0.32, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    ctx.restore();
  }

  function drawStarShape(x, y, r, rot, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.fillStyle = color;
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = (i * 4 * Math.PI) / 5 - Math.PI / 2;
      ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // ---------- Boucle ----------
  let spawnTimer = 0;
  let frenzySpawnTimer = 0;
  let lastTime = performance.now();

  function frame(time) {
    const dt = Math.min((time - lastTime) / 16.67, 3);
    lastTime = time;
    const now = performance.now();

    const pixelOn = curTheme().mode === 'pixel';
    if (pixelOn) {
      const pw = Math.max(1, Math.ceil(W / PIX));
      const ph = Math.max(1, Math.ceil(H / PIX));
      if (pixCanvas.width !== pw || pixCanvas.height !== ph) { pixCanvas.width = pw; pixCanvas.height = ph; }
      pixCtx.setTransform(1 / PIX, 0, 0, 1 / PIX, 0, 0);
      ctx = pixCtx;
    } else {
      ctx = mainCtx;
    }

    drawBackground(time, dt);

    // --- apparitions : l'écran n'est jamais vide ---
    const target = Math.min(10, 6 + Math.floor(level / 3)) + (now < feverUntil ? 3 : 0);
    spawnTimer -= dt;
    if (spawnTimer <= 0 && bubbles.length < target) {
      spawnBubble(Math.random() < 0.45 ? 'place' : 'rise');
      spawnTimer = 22 + Math.random() * 26;
    }
    // filet de sécurité : si presque tout a éclaté, on en fait réapparaître sur place
    while (bubbles.length < 3) spawnBubble('place');

    // petits défis doux
    if (!quest && firstPop) {
      questCooldown -= dt;
      if (questCooldown <= 0) newQuest();
    }

    // jauge de la fenêtre de combo
    const comboRem = Math.max(0, 1 - (now - lastPopTime) / 2500);
    if (combo >= 3 && comboRem > 0) {
      comboBarEl.style.opacity = '1';
      comboFillEl.style.width = (comboRem * 100).toFixed(0) + '%';
    } else {
      comboBarEl.style.opacity = '0';
    }

    // pluie de bulles pendant la frénésie
    if (now < frenzyUntil) {
      frenzySpawnTimer -= dt;
      if (frenzySpawnTimer <= 0 && bubbles.length < 18) {
        spawnBubble('fall');
        frenzySpawnTimer = 14 + Math.random() * 10;
      }
    }

    // étoile filante
    if (now >= nextStarAt && shootingStars.length === 0) {
      const fromLeft = Math.random() < 0.5;
      shootingStars.push({
        x: fromLeft ? -40 : W + 40,
        y: H * (0.08 + Math.random() * 0.25),
        vx: (fromLeft ? 1 : -1) * (4.5 + Math.random() * 2.5),
        vy: 0.5 + Math.random() * 0.5,
        rot: 0,
      });
      playChime([1568, 2093], 0.045); // petit signal : une étoile passe !
      nextStarAt = now + 18000 + Math.random() * 22000;
    }
    for (let i = shootingStars.length - 1; i >= 0; i--) {
      const s = shootingStars[i];
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.rot += 0.12 * dt;
      if (particles.length < 360) {
        particles.push({
          x: s.x - s.vx * 2, y: s.y - s.vy * 2,
          vx: -s.vx * 0.08, vy: 0.1,
          r: 1.5 + Math.random() * 2.5,
          life: 0.8, decay: 0.03,
          color: Math.random() < 0.5 ? '#ffd96a' : '#fff3c4',
          star: Math.random() < 0.4,
          rot: Math.random() * Math.PI, vrot: 0.1,
        });
      }
      if (s.x < -60 || s.x > W + 60 || s.y > H + 40) { shootingStars.splice(i, 1); continue; }
      ctx.save();
      ctx.shadowColor = 'rgba(255, 217, 106, 0.9)';
      ctx.shadowBlur = 18;
      drawStarShape(s.x, s.y, 14, s.rot, '#ffd96a');
      ctx.shadowBlur = 0;
      drawStarShape(s.x, s.y, 7, -s.rot * 0.7, '#fff7d6');
      ctx.restore();
    }

    // réaction en chaîne
    for (let i = chainQueue.length - 1; i >= 0; i--) {
      const c = chainQueue[i];
      if (now >= c.at) {
        chainQueue.splice(i, 1);
        const b = bubbles.find(bb => bb.id === c.id);
        if (b) popBubble(b, c.index, true);
      }
    }

    // --- bulles ---
    // légère répulsion pour qu'elles ne s'empilent pas
    for (let i = 0; i < bubbles.length; i++) {
      for (let j = i + 1; j < bubbles.length; j++) {
        const a = bubbles[i], c = bubbles[j];
        const dx = c.x - a.x, dy = c.y - a.y;
        const d = Math.hypot(dx, dy);
        const min = (a.r + c.r) * 0.9;
        if (d > 0.01 && d < min) {
          const push = (min - d) * 0.02 * dt;
          const nx = dx / d, ny = dy / d;
          a.x -= nx * push; a.y -= ny * push * 0.4;
          c.x += nx * push; c.y += ny * push * 0.4;
        }
      }
    }
    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      b.wobblePhase += b.wobbleSpeed * dt;
      b.x += Math.sin(b.wobblePhase) * b.wobbleAmp * dt;
      b.y += b.vy * dt;
      if (b.x < b.r) b.x = b.r;
      if (b.x > W - b.r) b.x = W - b.r;
      // elle s'envole ou se pose, c'est tout — aucune pénalité
      if (b.y < -b.r * 2 || b.y > H + b.r * 2.5) { bubbles.splice(i, 1); continue; }
      drawBubble(b, time);
    }

    // --- anneaux de pop ---
    for (let i = rings.length - 1; i >= 0; i--) {
      const ring = rings[i];
      ring.r += (ring.max - ring.r) * 0.18 * dt;
      ring.life -= 0.05 * dt;
      if (ring.life <= 0) { rings.splice(i, 1); continue; }
      ctx.globalAlpha = ring.life * 0.6;
      ctx.strokeStyle = ring.color;
      ctx.lineWidth = 2.5 * ring.life;
      ctx.beginPath();
      ctx.arc(ring.x, ring.y, ring.r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // --- particules ---
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 0.05 * dt;
      p.rot += p.vrot * dt;
      p.life -= p.decay * dt;
      if (p.life <= 0 || p.y > H + 20) { particles.splice(i, 1); continue; }
      ctx.globalAlpha = Math.min(1, p.life);
      if (p.star) {
        drawStarShape(p.x, p.y, p.r * Math.min(1, p.life) * 1.6, p.rot, p.color);
      } else {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * Math.min(1, p.life), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // --- popups "+N" ---
    for (let i = popups.length - 1; i >= 0; i--) {
      const p = popups[i];
      p.y -= 0.8 * dt;
      p.life -= 0.02 * dt;
      if (p.life <= 0) { popups.splice(i, 1); continue; }
      ctx.globalAlpha = Math.min(1, p.life * 2);
      ctx.font = '800 ' + (p.big ? 26 : 18) + 'px "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.lineWidth = 4;
      ctx.strokeText(p.text, p.x, p.y);
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, p.x, p.y);
      ctx.globalAlpha = 1;
    }

    // score animé en douceur
    if (displayedScore !== score) {
      displayedScore += Math.ceil((score - displayedScore) * 0.2);
      if (Math.abs(score - displayedScore) < 1) displayedScore = score;
      scoreEl.textContent = displayedScore;
      const prevAt = level <= 1 ? 0 : cumulAt(level - 1);
      const frac = Math.max(0, Math.min(1, (displayedScore - prevAt) / (cumulAt(level) - prevAt)));
      lvlbarEl.style.width = (frac * 100).toFixed(1) + '%';
    }

    if (pixelOn) {
      mainCtx.save();
      mainCtx.imageSmoothingEnabled = false;
      mainCtx.drawImage(pixCanvas, 0, 0, pixCanvas.width, pixCanvas.height, 0, 0, W, H);
      mainCtx.restore();
    }

    requestAnimationFrame(frame);
  }

  // départ direct sur un monde via l'ancre #niveauN
  if (window.location && window.location.hash) {
    const mh = /#niveau(\d+)/.exec(window.location.hash);
    if (mh) {
      level = Math.max(1, Math.min(99, +mh[1]));
      score = level > 1 ? cumulAt(level - 1) : 0;
      displayedScore = score;
      scoreEl.textContent = score;
      levelEl.textContent = 'Niveau ' + level;
      const th0 = curTheme();
      sky.top = th0.top.slice(); sky.mid = th0.mid.slice(); sky.bot = th0.bot.slice();
      sky.cloud = th0.cloud; sky.star = th0.star;
      for (let i = 0; i < fxA.length; i++) fxA[i] = 0;
      fxA[curThemeIdx()] = 1;
    }
  }
  applyThemeClass();

  // quelques bulles dès le départ, réparties à l'écran
  for (let i = 0; i < 8; i++) {
    const b = spawnBubble('place');
    b.birth = performance.now() - 1000; // déjà visibles, pas d'animation d'apparition
    b.y = H * 0.12 + (i / 8) * H * 0.7 + Math.random() * 40;
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
